# Firebase App Hosting: configuração de execução e ambiente.
# Nenhum valor secreto fica neste arquivo (o repositório é público).
# Crie cada segredo uma vez: firebase apphosting:secrets:set NOME
# Comandos explícitos: o framework (TanStack Start + Nitro) não é um dos detectados
# automaticamente pelo App Hosting. A saída do Nitro (node-server) fica em dist/.
scripts:
  buildCommand: npm run build
  runCommand: node dist/server/index.mjs

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 3
  concurrency: 80

env:
  # Build com saída Node (não Cloudflare).
  - variable: NITRO_PRESET
    value: node-server
    availability:
      - BUILD

  # Archive-only phase: legacy Supabase service-role is no longer injected.
  # Do not restore this credential when the Firebase domain migration resumes.

  # Callbacks agendados (Cloud Scheduler envia Authorization: Bearer <segredo>).
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # Piloto de leitura (somente leitura do snapshot importado no Firestore).
  # Passo a passo: docs/firebase/ATIVAR-PILOTO-LEITURA.md
  # O segredo precisa existir antes deste bloco ir para a main, senão o rollout falha:
  #   firebase apphosting:secrets:set CORMYR_FIREBASE_SNAPSHOT_ID --project cormyr
  - variable: CORMYR_FIREBASE_CLOUD_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_SNAPSHOT_ID
    secret: CORMYR_FIREBASE_SNAPSHOT_ID
    availability:
      - RUNTIME

  # Feature entrypoints for staged GO. All remain fail-closed unless
  # the independent Firestore stage, editorial review and live runtime
  # approvals are present. These flags alone cannot publish or write.
  - variable: CORMYR_FIREBASE_PUBLIC_CATALOG_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Traduções en/es/de pertencem ao projeto posterior; nenhuma rota de
  # tradução pode ser liberada por ativação acidental do catálogo em português.
  - variable: CORMYR_FIREBASE_PUBLIC_TRANSLATIONS_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_PUBLIC_TIME_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_CLOUD_MAIL_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Narrator-only PENDING week proposals; does not publish calendar or mail.
  # Server still verifies Firebase Auth and the immutable historic snapshot.
  - variable: CORMYR_FIREBASE_NARRATOR_WEEK_DRAFT_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Narrator-only House reconciliation diagnostics. Strictly read-only:
  # every request checks Firebase Auth, admin role and current House scope.
  # This enables investigation, NOT operational seeding, publication or GO.
  - variable: CORMYR_FIREBASE_CLOUD_RECONCILIATION_AUDIT_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Google Drive/Docs: crie os segredos abaixo e remova o comentário da opção escolhida.
  # Opção A, conta de serviço:
  # - variable: GOOGLE_SERVICE_ACCOUNT_JSON
  #   secret: GOOGLE_SERVICE_ACCOUNT_JSON
  #   availability:
  #     - RUNTIME
  # Opção B, OAuth da conta do Narrador:
  # - variable: GOOGLE_OAUTH_CLIENT_ID
  #   secret: GOOGLE_OAUTH_CLIENT_ID
  #   availability:
  #     - RUNTIME
  # - variable: GOOGLE_OAUTH_CLIENT_SECRET
  #   secret: GOOGLE_OAUTH_CLIENT_SECRET
  #   availability:
  #     - RUNTIME
  # - variable: GOOGLE_OAUTH_REFRESH_TOKEN
  #   secret: GOOGLE_OAUTH_REFRESH_TOKEN
  #   availability:
  #     - RUNTIME

# Configuração de autenticação e dados será substituída pelo Firebase na fase 2.

  # Owner-authorized initial campaign setup, still requires the narrator's
  # explicit saved date, round and source adoption inside a transaction.
  - variable: CORMYR_FIREBASE_CAMPAIGN_LAUNCH_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_CLOUD_NEWSPAPER_ENABLED
    value: "true"
    availability:
      - RUNTIME


  - variable: CORMYR_FIREBASE_HOUSE_ACTIVATION_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: CORMYR_FIREBASE_CLOUD_CONSTRUCTION_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: CORMYR_FIREBASE_CLOUD_TREASURY_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: CORMYR_FIREBASE_CLOUD_TREASURY_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Itens 4 e 5: nunca ativar mutações de Casas sem
  # reconciliação econômica e homologação por perfil no servidor.
  - variable: CORMYR_FIREBASE_HOUSE_OPS_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_HOUSE_RULES_ENABLED
    value: "false"
    availability:
      - RUNTIME

  # Gestão de contas: ativar somente depois de aceitar isolamento entre
  # Casas, sincronização das permissões e troca de senha no primeiro acesso.
  - variable: CORMYR_FIREBASE_ACCOUNTS_ENABLED
    value: "false"
    availability:
      - RUNTIME

