# Firebase App Hosting: configuração de execução e ambiente.
# Nenhum valor secreto fica neste arquivo (o repositório é público).
# Crie cada segredo uma vez: firebase apphosting:secrets:set NOME
# Comandos explícitos: o framework (TanStack Start + Nitro) não é um dos detectados
# automaticamente pelo App Hosting. A saída do Nitro (node-server) fica em dist/.
scripts:
  buildCommand: npm run build
  runCommand: node dist/server/index.mjs

# minInstances 1: mantém uma instância aquecida. Com 0, a primeira visita
# depois de um período parado esperava a partida do servidor e a releitura
# de todo o acervo (cache por instância), o que deixava fichas e o
# "Abrindo conselho" lentos. 1 GiB evita reinícios por falta de memória
# com o acervo em cache.
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 1
  maxInstances: 3
  concurrency: 80

env:
  # Build com saída Node (não Cloudflare).
  - variable: NITRO_PRESET
    value: node-server
    availability:
      - BUILD

  # Archive-only phase: legacy Supabase service-role is no longer injected.
  # Do not restore this credential when the Firebase domain migration resumes.

  # Callbacks agendados (Cloud Scheduler envia Authorization: Bearer <segredo>).
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # Piloto de leitura (somente leitura do snapshot importado no Firestore).
  # Passo a passo: docs/firebase/ATIVAR-PILOTO-LEITURA.md
  # O segredo precisa existir antes deste bloco ir para a main, senão o rollout falha:
  #   firebase apphosting:secrets:set CORMYR_FIREBASE_SNAPSHOT_ID --project cormyr
  - variable: CORMYR_FIREBASE_CLOUD_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_SNAPSHOT_ID
    secret: CORMYR_FIREBASE_SNAPSHOT_ID
    availability:
      - RUNTIME

  # Feature entrypoints for staged GO. All remain fail-closed unless
  # the independent Firestore stage, editorial review and live runtime
  # approvals are present. These flags alone cannot publish or write.
  - variable: CORMYR_FIREBASE_PUBLIC_CATALOG_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Traduções en/es/de pertencem ao projeto posterior; nenhuma rota de
  # tradução pode ser liberada por ativação acidental do catálogo em português.
  - variable: CORMYR_FIREBASE_PUBLIC_TRANSLATIONS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_PUBLIC_TIME_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # A Folha Sem Selo no site aberto (/jornal): só edições publicadas e a
  # equipe da Redação; conta uma leitura por aparelho para o Editor-Chefe.
  - variable: CORMYR_FIREBASE_PUBLIC_NEWSPAPER_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_CLOUD_MAIL_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Narrator-only PENDING week proposals; does not publish calendar or mail.
  # Server still verifies Firebase Auth and the immutable historic snapshot.
  - variable: CORMYR_FIREBASE_NARRATOR_WEEK_DRAFT_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Narrator-only House reconciliation diagnostics. Strictly read-only:
  # every request checks Firebase Auth, admin role and current House scope.
  # This enables investigation, NOT operational seeding, publication or GO.
  - variable: CORMYR_FIREBASE_CLOUD_RECONCILIATION_AUDIT_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Google Drive/Docs: crie os segredos abaixo e remova o comentário da opção escolhida.
  # Opção A, conta de serviço:
  # - variable: GOOGLE_SERVICE_ACCOUNT_JSON
  #   secret: GOOGLE_SERVICE_ACCOUNT_JSON
  #   availability:
  #     - RUNTIME
  # Opção B, OAuth da conta do Narrador:
  # - variable: GOOGLE_OAUTH_CLIENT_ID
  #   secret: GOOGLE_OAUTH_CLIENT_ID
  #   availability:
  #     - RUNTIME
  # - variable: GOOGLE_OAUTH_CLIENT_SECRET
  #   secret: GOOGLE_OAUTH_CLIENT_SECRET
  #   availability:
  #     - RUNTIME
  # - variable: GOOGLE_OAUTH_REFRESH_TOKEN
  #   secret: GOOGLE_OAUTH_REFRESH_TOKEN
  #   availability:
  #     - RUNTIME

# Configuração de autenticação e dados será substituída pelo Firebase na fase 2.

  # Owner-authorized initial campaign setup, still requires the narrator's
  # explicit saved date, round and source adoption inside a transaction.
  - variable: CORMYR_FIREBASE_CAMPAIGN_LAUNCH_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_CLOUD_NEWSPAPER_ENABLED
    value: "true"
    availability:
      - RUNTIME


  - variable: CORMYR_FIREBASE_HOUSE_ACTIVATION_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: CORMYR_FIREBASE_CLOUD_CONSTRUCTION_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: CORMYR_FIREBASE_CLOUD_TREASURY_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: CORMYR_FIREBASE_CLOUD_TREASURY_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Itens 4 e 5: nunca ativar mutações de Casas sem
  # reconciliação econômica e homologação por perfil no servidor.
  - variable: CORMYR_FIREBASE_HOUSE_OPS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Catálogo operacional legível pelas Casas autorizadas, sem permitir
  # alteração de regras antes do aceite autenticado do Narrador.
  - variable: CORMYR_FIREBASE_HOUSE_RULES_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_HOUSE_RULES_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Item 6: leitura operacional versionada de registros só após aceite no Cloud.
  - variable: CORMYR_FIREBASE_RECORDS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Item 7a: ações operacionais de espiões até aceite de isolamento por Casa.
  - variable: CORMYR_FIREBASE_SPY_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Item 8: representação exige Narrador real, sessão curta e auditoria.
  # Continua desativada até homologação do Firestore e das Casas.
  - variable: CORMYR_FIREBASE_REPRESENTATION_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Item 9: idade derivada de cadastro canônico verificado.
  - variable: CORMYR_FIREBASE_CHARACTER_AGES_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Item 10: encomendas pagas somente após aceite da economia e Jornal.
  - variable: CORMYR_FIREBASE_NEWSPAPER_COMMISSIONS_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Item 11: anexos privados em Storage. Nunca habilitar sem escopo,
  # assinatura IAM e homologação de referências e bucket.
  - variable: CORMYR_FIREBASE_PRIVATE_MEDIA_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Gestão de contas: ativar somente depois de aceitar isolamento entre
  # Casas, sincronização das permissões e troca de senha no primeiro acesso.
  # O inventário autenticado do Narrador pode ser consultado sem permitir
  # cadastro, alteração de vínculo, ativação ou mudança de senha.
  - variable: CORMYR_FIREBASE_ACCOUNTS_READ_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_ACCOUNTS_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # 20/11/2026: o proprietário pediu todas as funções ligadas. As chaves abaixo
  # só liberam as rotas; cada gravação continua conferindo o Firebase Auth, o
  # perfil e a aprovação correspondente no runtime (Contas > Aprovações).
  - variable: CORMYR_FIREBASE_PRIVATE_GM_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_CLOUD_CONSTRUCTION_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_CLOUD_TREASURY_AUDIT_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CORMYR_FIREBASE_DRIVE_AUDIT_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Galeria pública: exige também o segredo CORMYR_FIREBASE_PUBLIC_GALLERY_BUCKET
  # (nome do bucket cormyr-...). Sem ele a rota continua respondendo 503.
  - variable: CORMYR_FIREBASE_PUBLIC_GALLERY_ENABLED
    value: "true"
    availability:
      - RUNTIME
