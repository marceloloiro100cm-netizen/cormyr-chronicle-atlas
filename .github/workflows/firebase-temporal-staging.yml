name: Firebase Harptos temporal staging and private history
on:
  pull_request:
    paths:
      - 'scripts/firebase/stage-temporal-emulator*.mjs'
      - 'firebase/firestore.domain.rules'
      - 'docs/firebase/TEMPORAL-EMULATOR-STAGING.md'
      - '.github/workflows/firebase-temporal-staging.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/stage-temporal-emulator*.mjs'
      - 'firebase/firestore.domain.rules'
      - '.github/workflows/firebase-temporal-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harptos-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify syntax and Harptos calendar mapping
        run: |
          node --check scripts/firebase/stage-temporal-emulator.mjs
          node --check scripts/firebase/stage-temporal-emulator.integration.mjs
          node --test scripts/firebase/stage-temporal-emulator.test.mjs
          node scripts/verify-public-repo.mjs

  harptos-rules-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK and local Firestore Emulator
        run: npm install --no-save --package-lock=false firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0
      - name: Test private temporal history and read-only calendar by role
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-cormyr-migration \
            --config firebase/firebase-domain.json \
            "node scripts/firebase/stage-temporal-emulator.integration.mjs"
