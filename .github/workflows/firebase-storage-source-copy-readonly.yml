name: Firebase Storage - source to staging checksum proof (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/verify-storage-homologation.mjs'
      - 'scripts/firebase/cloud-operator-readiness.mjs'
      - '.github/workflows/firebase-storage-source-copy-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  source-copy-readonly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate metadata comparison contracts offline
        run: |
          node --test scripts/firebase/verify-storage-homologation.test.mjs
          node scripts/verify-public-repo.mjs
      - name: Authenticate existing short-lived reader OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cormyr
      - name: Compare original and homologation object size CRC32C MD5 metadata
        run: node scripts/firebase/verify-storage-homologation.mjs --readonly-live
      - name: Preserve independent source freshness and runtime gates
        if: always()
        run: |
          echo 'This is a strictly read-only object metadata comparison in fixed GCS prefixes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No objects, Auth, IAM, Firestore, runtime flags or player permissions modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Even equal object metadata cannot prove source freeze, fresh database delta or per-House E2E. Release remains NO_GO.' >> "$GITHUB_STEP_SUMMARY"
