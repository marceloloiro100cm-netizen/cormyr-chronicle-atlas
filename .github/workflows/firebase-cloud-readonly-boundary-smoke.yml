name: Firebase Cloud — readonly House route safety smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cloud-readonly-boundary-smoke*.mjs'
      - '.github/workflows/firebase-cloud-readonly-boundary-smoke.yml'
      - 'src/lib/archive-only.ts'
      - 'src/routes/api/firebase-cloud-house-quote.ts'
      - 'src/routes/api/firebase-operational-economy.ts'
      - 'src/routes/api/firebase-house-reconciliation-audit.ts'
      - 'src/routes/api/firebase-house-activation.ts'
      - 'src/lib/house/firebase-house-activation.ts'
      - 'src/routes/api/firebase-treasury-audit.ts'
      - 'src/routes/api/firebase-cloud-read.ts'
      - 'src/routes/api/firebase-cloud-mail.ts'
      - 'src/routes/api/firebase-cloud-newspaper.ts'
      - 'src/routes/api/firebase-cloud-treasury.ts'
  pull_request:
    paths:
      - 'scripts/firebase/cloud-readonly-boundary-smoke*.mjs'
      - '.github/workflows/firebase-cloud-readonly-boundary-smoke.yml'
      - 'src/lib/archive-only.ts'
      - 'src/routes/api/firebase-house-activation.ts'
      - 'src/lib/house/firebase-house-activation.ts'
      - 'src/routes/api/firebase-cloud-read.ts'
      - 'src/routes/api/firebase-cloud-mail.ts'
      - 'src/routes/api/firebase-cloud-newspaper.ts'
      - 'src/routes/api/firebase-cloud-treasury.ts'
  workflow_dispatch:
  # Public smoke is meaningful only after App Hosting verifies that the
  # corresponding main revision actually reached atlas.cormyr.com.br.
  workflow_run:
    workflows: ['Firebase App Hosting — verify main is actually serving']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact no-op requests and safe failure handling
        run: node --test scripts/firebase/cloud-readonly-boundary-smoke.test.mjs
      - name: Check public repository
        run: node scripts/verify-public-repo.mjs

  live-anonymous-denials:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    needs: safety-contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify anonymous Cloud guards and archive-locked treasury
        run: node scripts/firebase/cloud-readonly-boundary-smoke.mjs
      - name: Keep authenticated play and writes disabled
        if: always()
        run: |
          echo 'These anonymous no-op denials are not actual Firebase user tests or approval to migrate data.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No credentials, tokens, account activation, Firestore writes, DNS updates or IAM changes are performed.' >> "$GITHUB_STEP_SUMMARY"
