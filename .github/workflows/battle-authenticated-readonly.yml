name: Battle JWT acceptance (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-acceptance:
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 10
    env:
      BATTLE_E2E_SUPABASE_URL: ${{ secrets.BATTLE_E2E_SUPABASE_URL }}
      BATTLE_E2E_PUBLIC_KEY: ${{ secrets.BATTLE_E2E_PUBLIC_KEY }}
      BATTLE_E2E_EXPECTED_HOST: ${{ vars.BATTLE_E2E_EXPECTED_HOST }}
      BATTLE_E2E_NARRATOR_EMAIL: ${{ secrets.BATTLE_E2E_NARRATOR_EMAIL }}
      BATTLE_E2E_NARRATOR_PASSWORD: ${{ secrets.BATTLE_E2E_NARRATOR_PASSWORD }}
      BATTLE_E2E_PLAYER_EMAIL: ${{ secrets.BATTLE_E2E_PLAYER_EMAIL }}
      BATTLE_E2E_PLAYER_PASSWORD: ${{ secrets.BATTLE_E2E_PLAYER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: JWT/RLS acceptance with two real test sessions (no mutations)
        run: node scripts/battle-authenticated-readonly.mjs
