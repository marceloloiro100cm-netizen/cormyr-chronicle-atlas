name: Firebase Storage - verify scoped staging access

on:
  # Trigger new metadata audit after relevant changes. Only the scoped GCS
  # reader runs automatically; writer-identity verification stays manual.
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/verify-storage-homologation.mjs'
      - 'scripts/firebase/verify-storage-homologation.test.mjs'
      - '.github/workflows/firebase-storage-scoped-audit.yml'
  pull_request:
    paths:
      - 'scripts/firebase/verify-storage-homologation.mjs'
      - 'scripts/firebase/verify-storage-homologation.test.mjs'
      - '.github/workflows/firebase-storage-scoped-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify read-only inventory and privacy contracts (offline)
        run: |
          bash -n scripts/firebase/grant-scoped-staging-storage.sh
          node --test scripts/firebase/verify-storage-homologation.test.mjs
          node scripts/verify-public-repo.mjs

  audit-scoped-access:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate only as scoped Storage reader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cormyr

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare JSON API object metadata against CLI (staging only)
        run: node scripts/firebase/verify-storage-homologation.mjs --staging-only-readonly
      - name: Retain independent live source and cutover gates
        if: always()
        run: |
          echo 'Only staging metadata is read: no object downloads, source bucket access, IAM changes, uploads or deletes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source-vs-staging checksums and current live delta remain separate requirements; readyForCutover=false.' >> "$GITHUB_STEP_SUMMARY"

  verify-writer-identity:
    # A privileged uploader must never be touched by automatic push audits.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate as isolated staging uploader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-stager@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cormyr
      - name: Validate temporary credentials without writing
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth print-access-token --quiet >/dev/null
          test "$(gcloud config get-value project 2>/dev/null)" = "cormyr"
          echo "Staging uploader identity authenticated. No IAM, objects or databases modified."
