name: Read-only live House galleries smoke — no deployment
on:
  push:
    branches:
      - audit/house-gallery-public-20261121
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify three public House galleries and sample images (GET only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // Compare other read-only Firebase public entrypoints to isolate
          // an App Hosting runtime/secret problem from a gallery-only gate.
          for(const endpoint of ['catalog','time','newspaper']){
            try{
              const r=await fetch('https://atlas.cormyr.com.br/api/public/'+endpoint,
                {signal:AbortSignal.timeout(20000),headers:{Accept:'application/json'}});
              console.log('PUBLIC_BASELINE '+endpoint+' status='+r.status);
            }catch(e){console.log('PUBLIC_BASELINE '+endpoint+' request_error='+e.name);}
          }
          // Invalid requests must be rejected before any Firebase read. If
          // even these return 503, the handler is not being reached.
          for(const path of ['/api/public/house-gallery','/api/public/house-gallery?house=BAD',
            '/api/public/gallery-image?path=BAD']){
            const res=await fetch('https://atlas.cormyr.com.br'+path,{signal:AbortSignal.timeout(20000)});
            console.log('PUBLIC_ROUTE_PROBE '+path.split('?')[0]+
              ' has_query='+path.includes('?')+' status='+res.status);
          }
          const houses=['phelles','evenhand','goldfin','blester','axehand','silversword'];
          let ready=0;
          for(const house of houses){
            const url='https://atlas.cormyr.com.br/api/public/house-gallery?house='+house;
            let status=0,images=[],health='none';
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{Accept:'application/json'}});
              status=r.status;health=r.headers.get('x-cormyr-gallery-health')||'none';
              if(status===503){
                const raw=await r.text(),type=r.headers.get('content-type')||'';
                let bodyCategory='OTHER';
                try{
                  const parsed=JSON.parse(raw);
                  const keys=parsed&&typeof parsed==='object'&&!Array.isArray(parsed)
                    ?Object.keys(parsed).sort().join(','):'NON_OBJECT';
                  const err=parsed?.error;
                  const code=parsed?.code;
                  bodyCategory=err==='Galeria indisponível'?'APP_GALLERY_JSON':
                    err==='Galeria temporariamente indisponível'?'APP_TEMP_JSON':
                    err==='Catálogo temporariamente indisponível'?'CATALOG_JSON':
                    err==='Internal Server Error'?'INTERNAL_ERROR_JSON':
                    err==='Service Unavailable'?'SERVICE_UNAVAILABLE_JSON':
                    'JSON_KEYS_'+(keys==='error'?'ERROR_ONLY':keys==='error,message'?'ERROR_MESSAGE':'OTHER');
                  const allowedValue=v=>typeof v==='string'&&v.length<=100&&
                    /^[A-Za-zÀ-ÿ _-]+$/.test(v)?v:'REDACTED';
                  console.log('PUBLIC_HOUSE_SAFE_FIELDS '+house+
                    ' error='+allowedValue(err)+' message='+allowedValue(parsed?.message));
                  console.log('PUBLIC_HOUSE_JSON '+house+' keys_class='+
                    (keys==='error'?'ERROR_ONLY':keys==='error,message'?'ERROR_MESSAGE':'OTHER')+
                    ' error_type='+typeof err+' code_type='+typeof code+
                    ' json_text_bytes='+raw.length);
                }catch{
                  bodyCategory=raw.includes('Service Unavailable')?'GENERIC_SERVICE_UNAVAILABLE':
                    raw.includes('<html')?'HTML_ERROR':'OTHER';
                }
                console.log('PUBLIC_HOUSE_RESPONSE '+house+' content_type_class='+
                  (type.includes('application/json')?'JSON':type.includes('text/html')?'HTML':'OTHER')+
                  ' error_body_class='+bodyCategory+
                  ' has_phase_header='+(health!=='none'));
              }
              if(r.status===200){
                const json=await r.json();
                if(json.houseId!==house||!Array.isArray(json.images)||json.images.length===0||
                   json.images.length>250)throw Error('invalid_public_gallery_list');
                images=json.images;
              }
            }catch(e){console.log('PUBLIC_HOUSE '+house+' request_error='+e.name);}
            console.log('PUBLIC_HOUSE '+house+' status='+status+' health='+health+' image_count='+images.length);
            if(status!==200||!images.length)continue;
            const sample=images[0];
            const path=sample.path;
            if(!/^public-house\/[a-z0-9-]+\/[a-f0-9]{48}$/.test(path))
              throw Error('unexpected_public_path');
            const u='https://atlas.cormyr.com.br/api/public/gallery-image?path='+encodeURIComponent(path);
            try{
              const res=await fetch(u,{signal:AbortSignal.timeout(30000)});
              const ctype=res.headers.get('content-type')||'';
              console.log('PUBLIC_IMAGE '+house+' status='+res.status+' image_type_ok='+(/^image\/(png|jpeg|webp|gif)/.test(ctype)));
              if(res.status===200&&/^image\/(png|jpeg|webp|gif)/.test(ctype))ready++;
            }catch(e){console.log('PUBLIC_IMAGE '+house+' request_error='+e.name);}
          }
          console.log('PUBLIC_HOUSE_GALLERY_SMOKE successful_houses='+ready+' total_houses='+houses.length);
          if(ready!==houses.length)process.exit(2);
          // Prove all House lists are reachable and match the synced Drive
          // inventory. Download only six sample images above, not 2 GB of
          // GCS assets merely for the anonymous audit.
          const {readFileSync}=await import('node:fs');
          const src=readFileSync('public/cormyr/data.js','utf8');
          const dataset=JSON.parse(src.slice(src.indexOf('=')+1).trim().replace(/;\\s*$/,''));
          const ids=dataset.regions.flatMap(r=>r.houses).map(h=>h.nobleId);
          if(ids.length!==172||new Set(ids).size!==172)throw Error('source_inventory_invalid');
          let total=0,ok=0;
          const allPaths=new Set();
          for(let i=0;i<ids.length;i+=8){
            const batch=await Promise.all(ids.slice(i,i+8).map(async house=>{
              const res=await fetch('https://atlas.cormyr.com.br/api/public/house-gallery?house='+house,
                {signal:AbortSignal.timeout(20000),headers:{Accept:'application/json'}});
              if(res.status!==200)return {house,count:-1,images:[]};
              const j=await res.json();
              if(j.houseId!==house||!Array.isArray(j.images)||j.images.length<1||
                 j.images.length>250||j.images.some(x=>!x.path.startsWith('public-house/'+house+'/')))
                return {house,count:-1,images:[]};
              return {house,count:j.images.length,images:j.images};
            }));
            for(const b of batch){
              if(b.count<1){console.log('ALL_HOUSES_FAILED '+b.house);continue;}
              ok++;total+=b.count;
              for(const i of b.images){
                if(allPaths.has(i.path))throw Error('duplicate_gallery_image');
                allPaths.add(i.path);
              }
            }
          }
          console.log('PUBLIC_GALLERY_COMPLETE houses='+ok+' images='+total+
            ' unique_paths='+allPaths.size);
          if(ok!==172||total!==766||allPaths.size!==766)process.exit(3);
          NODE
