name: Reconcile npm lock for Firebase preview (temporary)
on:
  push:
    branches:
      - fix/firebase-preview-npm-only-20261113
    paths:
      - .github/workflows/firebase-preview-reconcile-lock.yml

permissions:
  contents: write

jobs:
  reconcile-lock:
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' && github.ref == 'refs/heads/fix/firebase-preview-npm-only-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firebase-preview-npm-only-20261113
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate complete npm dependency graph
        run: |
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Commit only repaired npm lock
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches npm ci."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(apphosting): resolve npm lock transitive versions for clean installs"
          git push origin HEAD:refs/heads/fix/firebase-preview-npm-only-20261113
