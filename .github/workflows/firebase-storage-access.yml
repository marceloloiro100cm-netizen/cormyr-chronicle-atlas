name: Firebase storage access core
on:
  # Só manual desde 17/11/2026: cobertura consolidada em Validate e
  # firebase-cross-domain-acceptance (docs/firebase/REVISAO-WORKFLOWS-2026-11-17.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-access-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          for f in scripts/firebase/storage-access-core.mjs scripts/firebase/storage-access-service.mjs scripts/firebase/storage-access-service.integration.mjs scripts/firebase/storage-references-core.mjs scripts/firebase/stage-storage-references-emulator.mjs scripts/firebase/storage-resolvers.mjs scripts/firebase/storage-resolvers.integration.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test scripts/firebase/storage-access-core.test.mjs scripts/firebase/storage-references-core.test.mjs
      - name: Public-repository private-data gate
        run: node scripts/verify-public-repo.mjs

  storage-access-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned tools for LOCAL emulators only
        run: npm install --no-save --package-lock=false firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0
      - name: Service integration on emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-cormyr-migration \
            --config firebase/firebase-domain.json \
            "node scripts/firebase/storage-access-service.integration.mjs && node scripts/firebase/storage-resolvers.integration.mjs"
