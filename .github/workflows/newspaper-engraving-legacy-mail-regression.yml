name: Jornal engravings + legacy narrator mail regression
on:
  pull_request:
    paths:
      - 'src/components/newspaper/NewspaperEngravings*'
      - 'src/components/players/chancelaria/**'
      - 'src/test/chancelaria-model.test.ts'
      - 'scripts/firebase/cloud-mail-service*'
      - '.github/workflows/newspaper-engraving-legacy-mail-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Historical mail backend and replay protections
        run: node --test scripts/firebase/cloud-mail-service.test.mjs
      - name: Newspaper engraving and Chancelaria frontend regressions
        run: bun run test -- src/components/newspaper/NewspaperEngravings.test.tsx src/test/chancelaria-model.test.ts
