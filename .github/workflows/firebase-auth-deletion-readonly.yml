name: Firebase — reconcile authorized Auth deletion (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/auth-deletion-reconciliation*.mjs'
      - 'scripts/firebase/cloud-auth-deletion-readonly*.mjs'
      - '.github/workflows/firebase-auth-deletion-readonly.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check audit source syntax
        run: |
          node --check scripts/firebase/auth-deletion-reconciliation.mjs
          node --check scripts/firebase/auth-deletion-reconciliation.test.mjs
          node --check scripts/firebase/cloud-auth-deletion-readonly.mjs
          node --check scripts/firebase/cloud-auth-deletion-readonly.test.mjs
      - name: Test private reconciliation without credentials
        run: |
          node --test scripts/firebase/auth-deletion-reconciliation.test.mjs
          node --test scripts/firebase/cloud-auth-deletion-readonly.test.mjs
          node --test scripts/firebase/lot8-http-role-acceptance.test.mjs
          node --test scripts/firebase/cloud-readonly-boundary-smoke.test.mjs
          node --test scripts/firebase/player-pilot-preflight.test.mjs
      - name: Check public repository for secrets
        run: node scripts/verify-public-repo.mjs

  protected-read-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-contract
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_APPROVED_DELETED_AUTH_UIDS: ${{ secrets.CORMYR_APPROVED_DELETED_AUTH_UIDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Require private, environment-authorized deletion list
        shell: bash
        run: |
          if [ -z "$CORMYR_APPROVED_DELETED_AUTH_UIDS" ]; then
            echo 'Private deletion approval not configured; no identity changes made.'
            exit 2
          fi
      - name: Obtain protected OIDC credentials
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Reconcile exactly approved deletion against live Firebase Auth
        run: node scripts/firebase/cloud-auth-deletion-readonly.mjs
      - name: Preserve gameplay release gate
        if: always()
        run: |
          echo 'Read-only reconciliation: not authorization for gameplay or Cloud writes.' >> "$GITHUB_STEP_SUMMARY"
