name: Firebase workspace — safe read-only runtime diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-workspace-runtime-diagnostic.yml'
      - 'scripts/firebase/workspace-runtime-login-diagnostic.mjs'
      - 'scripts/firebase/workspace-live-query-diagnostic.ts'
      - 'scripts/firebase/firebase-media-diagnostic.mjs'
      - 'scripts/firebase/newspaper-media-503-logs-readonly.mjs'
      - 'scripts/firebase/newspaper-media-failure-cause-readonly.mjs'
      - 'scripts/firebase/newspaper-third-draft-recovery-readonly.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source privacy and syntax before Cloud reads
        run: |
          node --check scripts/firebase/workspace-runtime-login-diagnostic.mjs
          node --check scripts/firebase/newspaper-media-503-logs-readonly.mjs
          node --check scripts/firebase/newspaper-media-failure-cause-readonly.mjs
          node --check scripts/firebase/newspaper-third-draft-recovery-readonly.mjs
          node scripts/verify-public-repo.mjs
      - name: Exchange OIDC for existing read-only service account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect migration table integrity with no writes or private output
        run: node scripts/firebase/workspace-runtime-login-diagnostic.mjs
      - name: Reproduce the Council's authorized read-only query batch
        if: success()
        run: bun scripts/firebase/workspace-live-query-diagnostic.ts
      - name: Inspect historical newspaper and gallery asset references (read only)
        run: node scripts/firebase/firebase-media-diagnostic.mjs
      - name: Inspect aggregate Cloud Run media 503 counts (read only; no log output)
        run: node scripts/firebase/newspaper-media-503-logs-readonly.mjs
      - name: Classify media gateway versus handler responses (no identities or files)
        run: node scripts/firebase/newspaper-media-failure-cause-readonly.mjs
      - name: Inventory third-edition recoverable drafts (read only; no article text)
        run: node scripts/firebase/newspaper-third-draft-recovery-readonly.mjs
