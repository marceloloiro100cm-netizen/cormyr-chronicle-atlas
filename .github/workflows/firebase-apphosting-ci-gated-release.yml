name: Firebase App Hosting — CI-green protected release request

# A verified main push may request a release without Cloud Shell.
# It cannot bypass the protected GitHub environment or Firebase IAM.
on:
  workflow_run:
    workflows: ['Validate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cormyr-protected-apphosting-current-main
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' &&
      github.ref == 'refs/heads/main' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      verified_sha: ${{ steps.check.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable REST rollout safeguards (offline)
        run: |
          node --check scripts/firebase/apphosting-protected-direct-api.mjs
          node --test scripts/firebase/apphosting-protected-direct-api.test.mjs
          node scripts/verify-public-repo.mjs
      - name: Require exactly current main and both green push checks
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='marceloloiro100cm-netizen'||repo!=='cormyr-chronicle-atlas')
              throw new Error('Unexpected deployment repository');
            const sha=context.eventName==='workflow_run'
              ?context.payload.workflow_run.head_sha
              :context.sha;
            const run=context.payload.workflow_run;
            if(context.eventName==='workflow_run'&&(
              run?.event!=='push'||run?.conclusion!=='success'||
              run?.head_branch!=='main'||
              run?.head_repository?.full_name!==owner+'/'+repo
            ))throw new Error('Untrusted workflow source');
            if(!/^[a-f0-9]{40}$/.test(sha)||context.sha!==sha)
              throw new Error('Workflow revision differs from current main');
            const branch=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(branch.data.commit.sha!==sha)
              throw new Error('Superseded main commit: no release requested');
            for(const workflow_id of ['validate.yml','build-check.yml']){
              const response=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id,branch:'main',per_page:100,
              });
              if(!response.data.workflow_runs.some(item=>
                item.head_sha===sha&&item.event==='push'&&
                item.status==='completed'&&item.conclusion==='success'))
                throw new Error('CI release gate incomplete: '+workflow_id);
            }
            core.setOutput('verified_sha',sha);
            core.info('Exact main SHA and both green checks verified; no Cloud changes.');

  rollout:
    needs: verify
    if: needs.verify.result == 'success'
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      CORMYR_RELEASE_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
      GOOGLE_CLOUD_PROJECT: cormyr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check immutable source and existing protected operator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test -n "$CORMYR_RELEASE_OPERATOR"
          test "$CORMYR_RELEASE_OPERATOR" != 'cormyr-gh-reader@cormyr.iam.gserviceaccount.com'
      - name: Revalidate main HEAD after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$VERIFIED_SHA"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Request guarded App Hosting rollout of exact verified SHA
        run: node scripts/firebase/apphosting-protected-direct-api.mjs
      - name: Preserve independent live-traffic release gate
        if: always()
        run: |
          echo 'A protected rollout request is NOT proof of the serving revision.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Firebase Auth, Firestore, Storage, IAM, DNS or runtime flags were changed here.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Players remain NO_GO until live SHA, scope and operational writes are validated.' >> "$GITHUB_STEP_SUMMARY"
