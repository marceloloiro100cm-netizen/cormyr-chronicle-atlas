name: Firebase App Hosting - live revision read-only audit

on:
  pull_request:
    paths:
      - 'scripts/firebase/apphosting-live-revision-readonly*.mjs'
      - '.github/workflows/firebase-apphosting-live-revision-readonly.yml'
  # Every change to main can trigger an App Hosting rollout; audit each source revision.
  # This is advisory while the rollout may be in progress, never a cutover gate.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only App Hosting REST contract tests (offline)
        run: node --test scripts/firebase/apphosting-live-revision-readonly.test.mjs
      - name: Verify npm install matches Firebase App Hosting
        run: npm ci --no-audit --no-fund
      - name: Verify npm build matches Firebase App Hosting
        env:
          NITRO_PRESET: node-server
        run: npm run build
      - name: Public repository privacy gate
        run: node scripts/verify-public-repo.mjs

  live-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exchange scoped GitHub OIDC for short-lived read-only GCP identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cormyr
      - name: Inspect App Hosting domain, active build and commit (GET only)
        run: node scripts/firebase/apphosting-live-revision-readonly.mjs
