name: Firebase App Hosting - protected verified main rollout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exact approval: DEPLOY_VERIFIED_CORMYR_MAIN'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cormyr-apphosting-protected-manual-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ steps.check.outputs.verified_sha }}
    steps:
      - name: Verify exact main SHA and required green push workflows
        id: check
        uses: actions/github-script@v7
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='marceloloiro100cm-netizen'||repo!=='cormyr-chronicle-atlas'||
               context.ref!=='refs/heads/main'||
               process.env.CONFIRMATION!=='DEPLOY_VERIFIED_CORMYR_MAIN')
              throw new Error('Release approval or repository mismatch');
            const head=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(head.data.commit.sha!==context.sha)
              throw new Error('main advanced; request a new rollout of the current SHA');
            for(const workflow_id of ['validate.yml','build-check.yml']){
              const response=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id,branch:'main',per_page:100,
              });
              const passed=response.data.workflow_runs.some(run=>
                run.head_sha===context.sha&&run.event==='push'&&
                run.status==='completed'&&run.conclusion==='success');
              if(!passed)throw new Error('Green CI missing for '+workflow_id+
                ' at the requested main revision');
            }
            core.setOutput('verified_sha',context.sha);
            core.info('Exact main SHA, Build and Validate checked. Cloud unchanged.');

  rollout:
    needs: verify
    if: needs.verify.result == 'success'
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_RELEASE_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source unchanged and dedicated operator configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          if [ -z "$CORMYR_RELEASE_OPERATOR" ] || [ "$CORMYR_RELEASE_OPERATOR" = 'cormyr-gh-reader@cormyr.iam.gserviceaccount.com' ]; then
            echo 'Protected deployment operator missing; rollout not requested.'
            exit 2
          fi
      - name: Obtain short-lived protected Google OIDC credentials
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Manually request exactly the verified main commit in Firebase App Hosting
        shell: bash
        run: |
          set -euo pipefail
          # No deploy to Vercel, no static Firebase Hosting or Cloud Run bypass.
          # App Hosting creates the build and rollout for this exact Git commit.
          npx --yes firebase-tools@15.2.0 apphosting:rollouts:create cormyr-preview \
            --project cormyr --git-commit "$VERIFIED_SHA" --non-interactive
      - name: Keep release decision independent
        if: always()
        run: |
          echo 'Manual Firebase App Hosting rollout request is NOT proof of serving revision.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify live traffic with firebase-apphosting-release-convergence.yml before calling production current.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public review, source delta, active runtimes and authenticated cross-House E2E remain separate GO gates.' >> "$GITHUB_STEP_SUMMARY"
