name: Firebase production public data and anonymous access acceptance

on:
  pull_request:
    paths:
      - 'scripts/firebase-production-acceptance-smoke*.mjs'
      - 'scripts/firebase-production-public-latency*.mjs'
      - '.github/workflows/firebase-production-acceptance.yml'
      - 'docs/firebase/PRODUCTION-ACCESS-ACCEPTANCE.md'
      - 'src/routes/**'
      - 'src/components/players/**'
      - 'src/components/newspaper/**'
      - 'src/lib/auth/**'
      - 'src/integrations/supabase/**'
      - 'apphosting.yaml'
  # Changes to the live app must be checked even if the smoke script itself
  # was not touched. A push smoke is advisory while a rollout is in progress.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the public and private-denial contracts offline
        run: node --test scripts/firebase-production-acceptance-smoke.test.mjs
      - name: Verify public repository privacy
        run: node scripts/verify-public-repo.mjs

  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test real public data routes and anonymous 401 denials — never log bodies
        id: probe
        continue-on-error: true
        run: node scripts/firebase-production-acceptance-smoke.mjs
      - name: Record precise production acceptance status without bypassing cutover safeguards
        if: always()
        env:
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "Public API and anonymous denial boundaries passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "One or more public or anonymous access boundaries failed." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Cormyr production access is not validated for player release."
          fi
          echo "No real user login, House permissions, private missives, Cloud database or service-role secret was tested." >> "$GITHUB_STEP_SUMMARY"
          echo "Cutover remains NO_GO. Supabase continues as source of truth." >> "$GITHUB_STEP_SUMMARY"
          echo "These HTTP probes verify whichever revision is serving when the test runs, not necessarily the just-pushed commit." >> "$GITHUB_STEP_SUMMARY"

  public-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify no-credential nine-request performance contracts
        run: node --test scripts/firebase-production-public-latency.test.mjs
      - name: Measure bounded read-only API latency — no response bodies
        id: latency
        continue-on-error: true
        run: node scripts/firebase-production-public-latency.mjs
      - name: Record the limits of these public, anonymous measurements
        if: always()
        env:
          OUTCOME: ${{ steps.latency.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "Nine public API requests passed latency measurement." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::One or more public API latency checks failed."
            echo "Public API requests failed the anonymous latency probe." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Numbers measure the GitHub runner only, not user-perceived latency or authenticated Firebase Cloud performance." >> "$GITHUB_STEP_SUMMARY"
          echo "readyForCutover=false; no production writes or private data reads." >> "$GITHUB_STEP_SUMMARY"
