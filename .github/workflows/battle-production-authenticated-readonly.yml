name: Battle PRODUCTION JWT/RLS acceptance (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-authentication:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      BATTLE_E2E_TARGET: production
      # Host do Supabase publicado no client do projeto. Previne teste acidental em homologação.
      BATTLE_E2E_EXPECTED_HOST: qkdznngbkwodsbpkpoax.supabase.co
      BATTLE_E2E_REQUIRE_PRIVATE_FIXTURE: 'true'
      BATTLE_E2E_SUPABASE_URL: ${{ secrets.BATTLE_E2E_SUPABASE_URL }}
      BATTLE_E2E_PUBLIC_KEY: ${{ secrets.BATTLE_E2E_PUBLIC_KEY }}
      BATTLE_E2E_NARRATOR_EMAIL: ${{ secrets.BATTLE_E2E_NARRATOR_EMAIL }}
      BATTLE_E2E_NARRATOR_PASSWORD: ${{ secrets.BATTLE_E2E_NARRATOR_PASSWORD }}
      BATTLE_E2E_PLAYER_EMAIL: ${{ secrets.BATTLE_E2E_PLAYER_EMAIL }}
      BATTLE_E2E_PLAYER_PASSWORD: ${{ secrets.BATTLE_E2E_PLAYER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Confirm protected production secrets and exact production host
        shell: bash
        run: |
          node --input-type=module -e '
            const required=["BATTLE_E2E_SUPABASE_URL","BATTLE_E2E_PUBLIC_KEY",
              "BATTLE_E2E_NARRATOR_EMAIL","BATTLE_E2E_NARRATOR_PASSWORD",
              "BATTLE_E2E_PLAYER_EMAIL","BATTLE_E2E_PLAYER_PASSWORD"];
            const missing=required.filter(key=>!process.env[key]);
            if(missing.length){
              console.error("P0 production: secrets ausentes: "+missing.join(", "));
              process.exit(2);
            }
            let host;
            try { host=new URL(process.env.BATTLE_E2E_SUPABASE_URL).hostname; }
            catch { console.error("P0 production: URL inválida.");process.exit(2); }
            if(host!==process.env.BATTLE_E2E_EXPECTED_HOST){
              console.error("P0 production: host não corresponde ao Supabase de produção.");process.exit(2);
            }
          '
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Authenticate two real sessions and verify private-data RLS without mutations
        run: node scripts/battle-authenticated-readonly.mjs
