name: Firebase compiled runtime smoke (Node SSR)

on:
  pull_request:
    paths:
      - 'src/routes/api/firebase-auth-verify.ts'
      - 'src/routes/api/firebase-cloud-read.ts'
      - 'src/routes/api/firebase-cloud-mail.ts'
      - 'src/lib/server/request-origin.ts'
      - 'scripts/firebase/cloud-mail-service.mjs'
      - 'scripts/firebase/cloud-mail-runtime-approval.mjs'
      - 'scripts/firebase/cloud-readonly-service.mjs'
      - 'scripts/firebase/cloud-access-remediation-plan*.mjs'
      - 'scripts/firebase/cloud-readonly-service.test.mjs'
      - 'scripts/firebase/cloud-mail-service.test.mjs'
      - 'src/routes/api/public/translations.ts'
      - 'src/server.ts'
      - 'vite.config.ts'
      - 'apphosting.yaml'
      - 'scripts/firebase-compiled-runtime-smoke*'
      - '.github/workflows/firebase-compiled-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/api/firebase-auth-verify.ts'
      - 'src/routes/api/firebase-cloud-read.ts'
      - 'src/routes/api/firebase-cloud-mail.ts'
      - 'src/lib/server/request-origin.ts'
      - 'scripts/firebase/cloud-mail-service.mjs'
      - 'scripts/firebase/cloud-mail-runtime-approval.mjs'
      - 'scripts/firebase/cloud-readonly-service.mjs'
      - 'scripts/firebase/cloud-access-remediation-plan*.mjs'
      - 'scripts/firebase/cloud-readonly-service.test.mjs'
      - 'scripts/firebase/cloud-mail-service.test.mjs'
      - 'src/routes/api/public/translations.ts'
      - 'src/server.ts'
      - 'vite.config.ts'
      - 'apphosting.yaml'
      - 'scripts/firebase-compiled-runtime-smoke*'
      - '.github/workflows/firebase-compiled-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-ssr-route-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install from the committed lockfile
        run: bun install --frozen-lockfile
      - name: Unit test the required route contracts
        run: node --test scripts/firebase-compiled-runtime-smoke.test.mjs
      - name: Build identical node-server preset used by Firebase App Hosting
        env:
          NITRO_PRESET: node-server
        run: bun run build
      - name: Prove HTTP route responses from the compiled Node server
        env:
          NITRO_PRESET: node-server
        run: node scripts/firebase-compiled-runtime-smoke.mjs
      - name: Inspect live Cloud read boundary after main push (anonymous, read-only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # This is diagnostic: App Hosting may still be rolling out this SHA.
          # The summary distinguishes a 401 Auth guard from a 503 disabled gate.
          node scripts/firebase/player-pilot-preflight.mjs
      - name: Ensure no private artifacts entered the public repository
        run: node scripts/verify-public-repo.mjs
