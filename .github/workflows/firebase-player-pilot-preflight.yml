name: Firebase player pilot — GitHub-only preflight

on:
  # Só manual desde 17/11/2026: cobertura consolidada em Validate e
  # firebase-cross-domain-acceptance (docs/firebase/REVISAO-WORKFLOWS-2026-11-17.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate fixed GETs, impossible anonymous POSTs and fail-closed release decisions
        run: node --test scripts/firebase/player-pilot-preflight.test.mjs
      - name: Verify public repository does not expose privileged data
        run: node scripts/verify-public-repo.mjs

  public-preflight:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect public GET routes and denial of invalid anonymous POSTs
        run: node scripts/firebase/player-pilot-preflight.mjs
      - name: Keep launch blocked until operator and cross-user acceptance
        if: always()
        run: |
          echo 'Green CI confirms only public reachability and anonymous denial at the inspected time; never a GO decision.' >> "$GITHUB_STEP_SUMMARY"
          echo 'POST probes use impossible actions and no credentials; no real commands, Auth enablement, IAM changes, Cloud writes, DNS edits, traffic promotion or rollbacks were attempted.' >> "$GITHUB_STEP_SUMMARY"
