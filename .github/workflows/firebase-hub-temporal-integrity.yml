name: Firebase Hub Temporal — integrity audit (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/hub-temporal-integrity-readonly.mjs'
      - '.github/workflows/firebase-hub-temporal-integrity.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate read-only script and repository privacy
        run: |
          node --check scripts/firebase/hub-temporal-integrity-readonly.mjs
          node scripts/verify-public-repo.mjs
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare archived source counts and live Firebase temporal data
        run: node scripts/firebase/hub-temporal-integrity-readonly.mjs
      - name: Audit is non-mutating
        if: always()
        run: |
          echo 'Only metadata, aggregate counts and public campaign week/date/version.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No event titles, source rows, identities, tokens or source snapshot IDs printed. No Cloud writes.' >> "$GITHUB_STEP_SUMMARY"
