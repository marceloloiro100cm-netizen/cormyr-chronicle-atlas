name: Firebase migration tools
on:
  pull_request:
    paths:
      - 'scripts/firebase/**'
      - 'scripts/firebase-*.mjs'
      - '.github/workflows/firebase-migration-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s scripts/firebase -p 'test_*.py'
      - run: bash -n scripts/firebase/prepare-backup.sh
      - run: node --test scripts/firebase-*.test.mjs
      - run: node scripts/verify-public-repo.mjs
