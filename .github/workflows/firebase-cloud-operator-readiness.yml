name: Firebase Cloud — protected operator migration audit (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cloud-operator-readiness*.mjs'
      - 'scripts/firebase/cloud-auth-inventory-readonly*.mjs'
      - 'scripts/firebase/auth-deletion-reconciliation*.mjs'
      - 'scripts/firebase/cloud-runtime-source-preflight*.mjs'
      - 'scripts/firebase/public-archive-coverage-readonly*.mjs'
      - 'scripts/firebase/public-review-candidates*.mjs'
      - 'scripts/firebase/public-archive-asset-integrity*.mjs'
      - 'public/cormyr/data.js'
      - 'public/cormyr/histories/**'
      - 'public/cormyr/assets/**'
      - '.github/workflows/firebase-cloud-operator-readiness.yml'
  pull_request:
    paths:
      - 'scripts/firebase/cloud-operator-readiness*.mjs'
      - 'scripts/firebase/cloud-runtime-source-preflight*.mjs'
      - 'scripts/firebase/public-archive-coverage-readonly*.mjs'
      - 'scripts/firebase/public-review-candidates*.mjs'
      - 'scripts/firebase/public-archive-asset-integrity*.mjs'
      - 'public/cormyr/data.js'
      - 'public/cormyr/histories/**'
      - 'public/cormyr/assets/**'
      - '.github/workflows/firebase-cloud-operator-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate revisions and manual approvals: an older pending protected
  # read-only audit must not stall fresh offline contracts on main.
  # Distinct manual runs must never replace a queued environment approval.
  group: cormyr-operator-readiness-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: false

jobs:
  synthetic:
    name: Offline verification (no Cloud credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify read-only evidence and negative cases
        run: |
          node --check scripts/firebase/auth-deletion-reconciliation.mjs
          node --check scripts/firebase/cloud-auth-deletion-readonly.mjs
          node --test scripts/firebase/cloud-auth-deletion-readonly.test.mjs
          node --test scripts/firebase/auth-deletion-reconciliation.test.mjs
          node --check scripts/firebase/cloud-operator-readiness.mjs
          node --test scripts/firebase/cloud-auth-inventory-readonly.test.mjs
          node --test scripts/firebase/cloud-operator-readiness.test.mjs
          node --test scripts/firebase/cloud-role-linkage-readonly.test.mjs
          node --test scripts/firebase/cloud-runtime-source-preflight.test.mjs
          node --test scripts/firebase/public-archive-coverage-readonly.test.mjs
          node --test scripts/firebase/public-review-candidates.test.mjs
          node --test scripts/firebase/public-archive-asset-integrity.test.mjs
          node scripts/firebase/public-archive-asset-integrity.mjs
          node --test scripts/firebase/auth-enable-all-test-accounts.test.mjs
      - name: Public-repo privacy gate
        run: node scripts/verify-public-repo.mjs

  operator-audit:
    name: Protected OIDC snapshot, Auth and runtime audit — never write
    # One-shot push trigger schedules an approval request; GitHub protected
    # environment STILL requires the human reviewer. Routine pushes run
    # only synthetic tests and cannot invoke the Cloud operator.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'ci(firebase): request one protected Cloud operator preview'))
    environment: firebase-auth-test-activation
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_AUTH_ACTIVATION_MODE: preview
      CORMYR_AUTH_TEST_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Require separate administrative OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CORMYR_AUTH_TEST_OPERATOR" ] || [ "$CORMYR_AUTH_TEST_OPERATOR" = 'cormyr-gh-reader@cormyr.iam.gserviceaccount.com' ]; then
            echo 'Dedicated protected operator is not configured.'
            exit 2
          fi
      - name: Obtain temporary GitHub OIDC credentials (protected environment)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      # Firebase Admin ADC obtains a short-lived access token directly.
      # No Cloud SDK setup or shell token printing is necessary here.
      - name: Install locked Firebase Admin dependency
        run: bun install --frozen-lockfile
      - name: Verify live Auth inventory against 14 immutable historical records and Cloud stages
        run: node scripts/firebase/cloud-operator-readiness.mjs
      - name: Explicitly retain NO_GO until Cloud E2E and fresh delta acceptance
        if: always()
        run: |
          echo 'This job used preview mode and a read-only Auth facade; no user flag, IAM, Firestore or runtime was modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A green audit is not permission to release players or cut over. Real per-House E2E is mandatory.' >> "$GITHUB_STEP_SUMMARY"

  report-request:
    name: Record manual audit run and its offline gate
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    env:
      OFFLINE_RESULT: ${{ needs.synthetic.result }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='marceloloiro100cm-netizen'||repo!=='cormyr-chronicle-atlas')return;
            const offline=['success','failure','cancelled','skipped'].includes(
              process.env.OFFLINE_RESULT)?process.env.OFFLINE_RESULT:'unknown';
            const url='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const body=[
              '### Auditoria Cloud protegida — execução solicitada',
              'GitHub Actions: '+url,
              'Testes offline: **'+offline+'**',
              'A etapa Cloud é independente, exige aprovação de ambiente e ainda não está comprovada por este registro.',
              'Nenhuma autorização de jogadores ou alteração Cloud é concedida. **NO_GO**.'
            ].join('\n\n');
            await github.rest.issues.createComment({owner,repo,issue_number:582,body});

  report-outcome:
    name: Record final protected Cloud audit result
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: operator-audit
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    env:
      PROTECTED_RESULT: ${{ needs.operator-audit.result }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='marceloloiro100cm-netizen'||repo!=='cormyr-chronicle-atlas')return;
            const result=['success','failure','cancelled','skipped'].includes(
              process.env.PROTECTED_RESULT)?process.env.PROTECTED_RESULT:'unknown';
            const url='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const body=[
              '### Auditoria Cloud protegida — conclusão do job',
              'GitHub Actions: '+url,
              'Resultado do job protegido: **'+result+'**',
              'A conclusão não comprova liberação de usuários, revisão de Casas, Storage de origem nem E2E autenticado.',
              '**Decisão de liberação: NO_GO.**'
            ].join('\n\n');
            await github.rest.issues.createComment({owner,repo,issue_number:582,body});
