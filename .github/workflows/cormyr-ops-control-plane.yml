name: Cormyr Ops — GitHub operational controller

on:
  issues:
    types: [edited]
  schedule:
    - cron: '23 10 * * *'
  workflow_run:
    workflows:
      - 'Firebase cross-domain acceptance — isolated emulator'
      - 'Firebase unified historical and live mailbox (private emulator)'
      - 'Firebase mail read receipts (private emulator)'
      - 'Firebase typed domain staging and security'
      - 'Firebase Cloud — protected operator migration audit (read-only)'
      - 'Firebase App Hosting — verify main is actually serving'
      - 'Firebase App Hosting - live revision read-only audit'
      - 'Firebase Cloud access readiness — read-only OIDC'
      - 'Validate'
      - 'Build check'
      - 'Firebase player pilot — GitHub-only preflight'
      - 'Firebase Cloud — bootstrap disabled runtime drafts'
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: 'Audit, Auth or protected disabled runtime draft'
        type: choice
        required: true
        default: audit
        options: [status-audit, apphosting-diagnostic, audit, operator-audit, auth-preview, auth-deletion-audit, auth-inventory-audit, verify-emulators, verify-build, verify-pilot, runtime-preview, runtime-draft]

permissions:
  contents: read

concurrency:
  # Every issue-title edit is an independent requested action; never drop
  # earlier pending dispatches when another request arrives immediately.
  group: cormyr-ops-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  controlled-operations:
    if: >-
      github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' &&
      github.event_name != 'workflow_run' &&
      (github.event_name != 'issues' ||
       (github.event.issue.number == 568 && github.event.changes.title != null))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Only allow audited requests via the fixed control issue
        uses: actions/github-script@v7
        with:
          script: |
            const REPO = 'marceloloiro100cm-netizen/cormyr-chronicle-atlas';
            const CONTROL_ISSUE = 568;
            const AUTH_WORKFLOW = '.github/workflows/firebase-auth-enable-all-test-accounts.yml';
            const titleFormat = /^Cormyr Ops \| (status-audit|apphosting-diagnostic|audit|operator-audit|auth-preview|auth-deletion-audit|auth-inventory-audit|verify-emulators|verify-build|verify-pilot|runtime-preview|runtime-draft|cancel-auth:([1-9][0-9]{7,12})) \| ([0-9]{8})$/;
            const {owner, repo} = context.repo;
            if (owner + '/' + repo !== REPO || Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) {
              core.info('Untrusted context or retry: no remote action');
              return;
            }
            let operation;
            if (context.eventName === 'schedule') operation = 'audit';
            else if (context.eventName === 'workflow_dispatch') {
              operation = context.payload.inputs?.task;
              if (!['status-audit', 'apphosting-diagnostic', 'audit', 'operator-audit', 'auth-preview', 'auth-deletion-audit', 'auth-inventory-audit', 'verify-emulators', 'verify-build', 'verify-pilot', 'runtime-preview', 'runtime-draft'].includes(operation)) {
                core.info('Unknown manual command: no action');
                return;
              }
            } else if (context.eventName === 'issues') {
              const event = context.payload;
              if (event.action !== 'edited' || event.issue?.number !== CONTROL_ISSUE ||
                  event.issue?.pull_request ||
                  typeof event.changes?.title?.from !== 'string' ||
                  event.changes.title.from === event.issue.title) {
                core.info('Not a new control-title edit: no action');
                return;
              }
              const match = titleFormat.exec(event.issue.title || '');
              if (!match) {
                core.info('Title not allowlisted: no action');
                return;
              }
              operation = match[1];
            } else return;
            if (operation === 'status-audit') {
              const ids=[
                ['firebase-apphosting-live-revision-readonly.yml','App Hosting: diagnóstico completo de rollouts'],
                ['firebase-cloud-operator-readiness.yml','Cloud OIDC protegido'],
                ['firebase-auth-deletion-readonly.yml','Identidade da exclusão'],
                ['firebase-cloud-runtime-drafts.yml','Calendário/runtimes (prévia)'],
                ['firebase-apphosting-release-convergence.yml','App Hosting'],
                ['firebase-cloud-access-readiness.yml','Acesso Cloud somente leitura'],
                ['validate.yml','Validate geral'],
                ['build-check.yml','Build App Hosting'],
                ['firebase-cross-domain-acceptance.yml','Casas e domínios (emulador)'],
                ['firebase-mail-unified.yml','Missivas integradas (emulador)'],
                ['firebase-read-receipts.yml','Leitura de Missivas (emulador)'],
                ['firebase-player-pilot-preflight.yml','Piloto público anônimo']
              ];
              const safeStatus=new Set(['queued','in_progress','waiting','pending','requested','completed']);
              const safeOutcome=new Set(['success','failure','cancelled','timed_out','skipped','neutral','action_required']);
              const lines=[
                '## Cormyr — status real de GitHub Actions (metadados públicos)',
                '',
                'Consulta somente leitura de runs já existentes na branch main. Nenhum workflow foi disparado por esta verificação.',
                ''
              ];
              const results=await Promise.all(ids.map(async([filename,label])=>{
                try{
                  const x=await github.rest.actions.listWorkflowRuns({
                    owner,repo,workflow_id:filename,branch:'main',per_page:3
                  });
                  const runs=Array.isArray(x.data.workflow_runs)?x.data.workflow_runs:[];
                  return {label,runs:runs.slice(0,2).map(run=>({
                    id:Number(run.id),
                    status:safeStatus.has(run.status)?run.status:'unknown',
                    conclusion:safeOutcome.has(run.conclusion)?run.conclusion:'n/a'
                  }))};
                }catch{return {label,runs:null};}
              }));
              for(const item of results){
                if(item.runs===null){lines.push('- **'+item.label+':** consulta indisponível');continue;}
                if(!item.runs.length){lines.push('- **'+item.label+':** nenhum run localizado');continue;}
                lines.push('- **'+item.label+':** '+item.runs.map(run=>
                  '[#'+run.id+'](https://github.com/'+REPO+'/actions/runs/'+run.id+') '+
                  run.status+'/'+run.conclusion).join(' · '));
              }
              lines.push('','Resultados de emulador e de build não autorizam o jogo. Jobs protegidos em waiting exigem aprovação do ambiente. Liberação: NO_GO.');
              await github.rest.issues.createComment({
                owner,repo,issue_number:582,body:lines.join('\n')
              });
              core.info('Published public-safe existing run status in issue 582');
              return;
            }
            const tasks = operation === 'apphosting-diagnostic' ? [
              ['firebase-apphosting-live-revision-readonly.yml', {}],
            ] : operation === 'audit' ? [
              ['firebase-apphosting-release-convergence.yml', {}],
              ['firebase-cloud-access-readiness.yml', {}],
            ] : operation === 'operator-audit' ? [
              ['firebase-cloud-operator-readiness.yml', {}],
            ] : operation === 'verify-pilot' ? [
              ['firebase-player-pilot-preflight.yml', {}],
            ] : operation === 'verify-build' ? [
              ['validate.yml', {}],
              ['build-check.yml', {}],
            ] : operation === 'verify-emulators' ? [
              ['firebase-cross-domain-acceptance.yml', {}],
              ['firebase-mail-unified.yml', {}],
              ['firebase-read-receipts.yml', {}],
              ['firebase-domain-staging.yml', {}],
            ] : operation === 'auth-inventory-audit' ? [
              ['firebase-auth-inventory-readonly.yml', {}],
            ] : operation === 'auth-deletion-audit' ? [
              ['firebase-auth-deletion-readonly.yml', {}],
            ] : operation === 'runtime-preview' ? [
              ['firebase-cloud-runtime-drafts.yml', {mode:'preview'}],
            ] : operation === 'runtime-draft' ? [
              ['firebase-cloud-runtime-drafts.yml', {
                mode:'apply', confirmation:'CREATE_DISABLED_CORMYR_RUNTIME_DRAFTS',
              }],
            ] : operation === 'auth-preview' ? [
              ['firebase-auth-enable-all-test-accounts.yml', {mode:'preview'}],
            ] : [];
            if (tasks.length) {
              const allowed = new Set([
                'firebase-apphosting-release-convergence.yml',
                'firebase-apphosting-live-revision-readonly.yml',
                'firebase-cloud-access-readiness.yml',
                'firebase-cloud-operator-readiness.yml',
                'firebase-auth-enable-all-test-accounts.yml',
                'firebase-cloud-runtime-drafts.yml',
                'firebase-auth-deletion-readonly.yml',
                'firebase-auth-inventory-readonly.yml',
                'firebase-cross-domain-acceptance.yml',
                'firebase-mail-unified.yml',
                'firebase-read-receipts.yml',
                'firebase-domain-staging.yml',
                'validate.yml',
                'build-check.yml',
                'firebase-player-pilot-preflight.yml',
              ]);
              const protectedRuns = new Set([
                'firebase-cloud-operator-readiness.yml',
                'firebase-auth-deletion-readonly.yml',
                'firebase-auth-inventory-readonly.yml',
                'firebase-cloud-runtime-drafts.yml'
              ]);
              for (const [workflow_id, inputs] of tasks) {
                if (!allowed.has(workflow_id)) throw new Error('Workflow not allowlisted');
                // Avoid a queue of duplicate protected jobs requiring approvals.
                // A new protected request must not silently replace a waiting one.
                if (protectedRuns.has(workflow_id)) {
                  const response=await github.rest.actions.listWorkflowRuns({
                    owner,repo,workflow_id,branch:'main',per_page:40
                  });
                  const active=response.data.workflow_runs.find(run=>
                    run.event==='workflow_dispatch'&&
                    ['waiting','pending','queued','requested','in_progress'].includes(run.status));
                  if (active) {
                    const safeId=Number(active.id);
                    core.info('Protected audit already pending: '+workflow_id+
                      ' run #'+safeId+'. No duplicate requested.');
                    await core.summary.addRaw('- Existing protected run: '+
                      workflow_id+' #'+safeId+' (no new dispatch)\\n').write();
                    continue;
                  }
                }
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id, ref:'main', inputs,
                });
                core.info('Requested allowlisted workflow: ' + workflow_id);
                await core.summary.addRaw('- Requested: ' + workflow_id + '\n').write();
              }
              if (operation.startsWith('auth-') || operation === 'operator-audit' || operation === 'runtime-draft')
                await core.summary.addRaw('Protected firebase-auth-test-activation approval remains mandatory for Auth, deletion audit, operator audits and disabled runtime drafts.\n').write();
              return;
            }
            if (!operation.startsWith('cancel-auth:')) return;
            const runId = Number(operation.slice('cancel-auth:'.length));
            if (!Number.isSafeInteger(runId) || runId < 10000000) return;
            const response = await github.rest.actions.getWorkflowRun({owner,repo,run_id:runId});
            const run = response.data;
            if (run.repository?.full_name !== REPO ||
                run.path !== AUTH_WORKFLOW || run.head_branch !== 'main' ||
                run.event !== 'workflow_dispatch' ||
                !['waiting', 'pending', 'queued'].includes(run.status)) {
              core.info('The selected Auth run is not eligible for cancellation');
              return;
            }
            await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:runId});
            core.info('Cancellation requested only for pending Auth run');
            await core.summary.addRaw('Pending Auth run cancellation requested: #' + runId + '\n').write();
      - name: Preserve protected changes and publication gates
        if: always()
        run: |
          echo 'Controller never writes Cloud. Protected runtime-draft can create only two disabled Firestore root documents.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Protected Auth activation still requires separate GitHub environment review.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A dispatch request is NOT evidence that a downstream job succeeded.' >> "$GITHUB_STEP_SUMMARY"

  report-verifications:
    name: Report completed read-only and synthetic acceptance jobs
    # Evaluate the event payload inside the script so a missing optional
    # workflow_run field does not silently skip this evidence job.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const allowed = Object.freeze({
              'Firebase cross-domain acceptance — isolated emulator':'Emulador: matriz geral de Casas/segurança',
              'Firebase unified historical and live mailbox (private emulator)':'Emulador: caixa de Missivas integrada',
              'Firebase mail read receipts (private emulator)':'Emulador: comprovantes de leitura',
              'Firebase typed domain staging and security':'Emulador: perfis e regras entre Casas',
              'Firebase Cloud — protected operator migration audit (read-only)':'Cloud: auditoria operacional protegida (somente leitura)',
              'Firebase App Hosting — verify main is actually serving':'Cloud: revisão atendida pelo App Hosting',
              'Firebase App Hosting - live revision read-only audit':'Cloud: inspeção detalhada de builds e rollouts',
              'Firebase Cloud access readiness — read-only OIDC':'Cloud: disponibilidade de fontes por OIDC',
              'Validate':'CI: contratos, TypeScript, build e testes de componentes',
              'Build check':'CI: saída do Firebase App Hosting e tipografia do Jornal',
              'Firebase player pilot — GitHub-only preflight':'Site: leitura pública e bloqueios de visitante anônimo',
              'Firebase Cloud — bootstrap disabled runtime drafts':'Cloud: pré-validação de fontes e runtimes (prévia, somente leitura)'
            });
            const incoming=context.payload.workflow_run;
            if (!incoming || !Number.isSafeInteger(Number(incoming.id))) return;
            const expected='marceloloiro100cm-netizen/cormyr-chronicle-atlas';
            if (context.repo.owner+'/'+context.repo.repo!==expected) return;
            // Resolve authoritative GitHub data: optional webhook fields may
            // be absent even for a completed, legitimate manual run.
            const {data:run}=await github.rest.actions.getWorkflowRun({
              ...context.repo,run_id:Number(incoming.id)
            });
            if (!Object.hasOwn(allowed,run.name) ||
                run.repository?.full_name!==expected ||
                run.head_repository?.full_name!==expected ||
                run.head_branch!=='main'||
                run.event!=='workflow_dispatch'||
                run.status!=='completed') return;
            const verdict=['success','failure','cancelled','timed_out','skipped'].includes(run.conclusion)
              ? run.conclusion:'unknown';
            const url='https://github.com/'+expected+'/actions/runs/'+Number(run.id);
            const lines=[
              '### Resultado automático de execução — '+allowed[run.name],
              '',
              'GitHub Actions: '+url,
              '',
              'Conclusão: **'+verdict+'**',
              '',
              'Este registro prova apenas a conclusão do workflow. Testes em emulador não comprovam acesso real em produção. Uma auditoria somente de leitura não autoriza gravações nem libera jogadores.',
              '',
              '**Decisão da campanha: NO_GO até aceite real independente.**'
            ];
            await github.rest.issues.createComment({
              ...context.repo,issue_number:582,body:lines.join('\n')
            });
