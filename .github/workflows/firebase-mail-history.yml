name: Firebase private mail history and replies
on:
  pull_request:
    paths:
      - 'scripts/firebase/stage-mail-history-emulator*.mjs'
      - 'scripts/firebase/mail-history-fixtures.mjs'
      - 'scripts/firebase/stage-all-emulators*.mjs'
      - 'scripts/firebase/stage-typed-domain-emulator*.mjs'
      - 'scripts/firebase/letter-inbox-service*.mjs'
      - 'firebase/firestore.domain.rules'
      - 'docs/firebase/MAIL-HISTORY-STAGING.md'
      - '.github/workflows/firebase-mail-history.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/stage-mail-history-emulator*.mjs'
      - 'scripts/firebase/mail-history-fixtures.mjs'
      - 'scripts/firebase/stage-all-emulators*.mjs'
      - 'scripts/firebase/stage-typed-domain-emulator*.mjs'
      - 'scripts/firebase/letter-inbox-service*.mjs'
      - 'firebase/firestore.domain.rules'
      - '.github/workflows/firebase-mail-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mail-history-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate private history and non-delivered letter secrecy
        run: |
          node --check scripts/firebase/stage-mail-history-emulator.mjs
          node --check scripts/firebase/stage-mail-history-emulator.integration.mjs
          node --test scripts/firebase/stage-mail-history-emulator.test.mjs
          node --test scripts/firebase/stage-all-emulators.test.mjs
          node --test scripts/firebase/stage-typed-domain-emulator.test.mjs
          node --test scripts/firebase/letter-inbox-service.test.mjs
          node scripts/verify-public-repo.mjs

  mail-history-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install local Firestore Emulator SDKs
        run: npm install --no-save --package-lock=false firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0
      - name: Verify private mail archive and per-user replies
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-cormyr-migration \
            --config firebase/firebase-domain.json \
            "node scripts/firebase/stage-mail-history-emulator.integration.mjs"
