name: Firebase real workspace import
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/workspace-import*.mjs'
      - 'scripts/firebase/workspace-column-types.mjs'
      - '.github/workflows/firebase-workspace-import.yml'
permissions:
  contents: read
concurrency:
  group: cormyr-workspace-import
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/firebase/workspace-import.test.mjs
  import:
    needs: contract
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import verified originals without overwriting operational data
        run: node scripts/firebase/workspace-import-cli.mjs
