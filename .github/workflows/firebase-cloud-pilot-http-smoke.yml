name: Firebase Cloud pilot public HTTP acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cloud-pilot-http-smoke*.mjs'
      - '.github/workflows/firebase-cloud-pilot-http-smoke.yml'
  pull_request:
    paths:
      - 'scripts/firebase/cloud-pilot-http-smoke*.mjs'
      - '.github/workflows/firebase-cloud-pilot-http-smoke.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Anonymous Firebase-only HTTP smoke contract
        run: node --test scripts/firebase/cloud-pilot-http-smoke.test.mjs
      - name: Repository privacy gate
        run: node scripts/verify-public-repo.mjs

  live-public:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployed Firebase pilot without credentials or campaign data
        run: node scripts/firebase/cloud-pilot-http-smoke.mjs
      - name: Retain no-cutover warning
        if: always()
        run: echo 'HTTP public smoke never verifies private Firebase Auth, Firestore rules or game writes; readyForCutover=false.' >> "$GITHUB_STEP_SUMMARY"
