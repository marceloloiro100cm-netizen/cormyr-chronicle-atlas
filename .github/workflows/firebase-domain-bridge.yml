name: Firebase domain bridge (local emulator boundary)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Emulator-only domain boundary and house access tests
        run: |
          node --test scripts/firebase/domain-http-handler.test.mjs
          node --test scripts/firebase/house-view-service.test.mjs
