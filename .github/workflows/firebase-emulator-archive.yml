name: Firebase Firestore private emulator archive
on:
  pull_request:
    paths:
      - 'scripts/firebase/stage-firestore-emulator*.mjs'
      - 'scripts/firebase/audit-private-access-graph*.mjs'
      - 'docs/firebase/PRIVATE-FIRESTORE-EMULATOR-ARCHIVE.md'
      - '.github/workflows/firebase-emulator-archive.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/stage-firestore-emulator*.mjs'
      - '.github/workflows/firebase-emulator-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-private-emulator-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check strict archive importer syntax
        run: |
          node --check scripts/firebase/stage-firestore-emulator.mjs
          node --check scripts/firebase/audit-private-access-graph.mjs
      - name: Synthetic dry run and fake Firestore emulator tests
        run: node --test scripts/firebase/stage-firestore-emulator.test.mjs scripts/firebase/audit-private-access-graph.test.mjs
      - name: Check public repository for private backup files
        run: node scripts/verify-public-repo.mjs

  emulator-integration-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase emulator and Admin SDK
        run: npm install --no-save --package-lock=false firebase-admin@14.5.1 firebase-tools@15.35.0
      - name: Import and replay synthetic archive inside real Firestore emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-cormyr-migration \
            --config firebase/firebase.json \
            "node scripts/firebase/stage-firestore-emulator.integration.mjs"
