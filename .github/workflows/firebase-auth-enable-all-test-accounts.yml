name: Firebase Auth — enable all 14 existing accounts for testing

on:
  pull_request:
    paths:
      - 'scripts/firebase/auth-enable-all-test-accounts*.mjs'
      - '.github/workflows/firebase-auth-enable-all-test-accounts.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview (no changes) or activate all 14 existing Auth accounts'
        required: true
        type: choice
        options: [preview, activate]
        default: preview
      confirmation:
        description: 'For activate, type exactly ENABLE_ALL_14_CORMYR_TEST_ACCOUNTS'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cormyr-auth-test-accounts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Synthetic authorization and safety preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test counts, matching UIDs, no role changes and deny-by-default controls
        run: node --test scripts/firebase/auth-enable-all-test-accounts.test.mjs
      - name: Public repository privacy gate
        run: node scripts/verify-public-repo.mjs

  operator:
    name: Activate or preview 14 existing users (manual, approved OIDC identity)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      CORMYR_AUTH_ACTIVATION_MODE: ${{ inputs.mode }}
      CORMYR_AUTH_ACTIVATION_CONFIRMATION: ${{ inputs.confirmation }}
      CORMYR_AUTH_TEST_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
      GOOGLE_CLOUD_PROJECT: cormyr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Require an isolated and explicitly configured privileged identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CORMYR_AUTH_TEST_OPERATOR" ] || \
             [ "$CORMYR_AUTH_TEST_OPERATOR" = 'cormyr-gh-reader@cormyr.iam.gserviceaccount.com' ]; then
            echo 'Dedicated Firebase Auth operator identity not configured. No accounts changed.'
            exit 2
          fi
          if [ "$CORMYR_AUTH_ACTIVATION_MODE" = 'activate' ] && \
             [ "$CORMYR_AUTH_ACTIVATION_CONFIRMATION" != 'ENABLE_ALL_14_CORMYR_TEST_ACCOUNTS' ]; then
            echo 'Explicit activation confirmation missing. No accounts changed.'
            exit 2
          fi
      - name: Authenticate existing GitHub workload identity with dedicated operator
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Install already locked Firebase Admin dependency
        run: bun install --frozen-lockfile
      - name: Validate and optionally enable all 14 matching users
        run: node scripts/firebase/auth-enable-all-test-accounts.mjs
      - name: Retain limited outcome on GitHub
        if: always()
        run: |
          echo 'All 14 account test enablement affects ONLY disabled flags in Firebase Authentication.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Profiles, House membership, active access state, Cloud runtimes and app availability remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Activation success is NOT campaign release or cross-House E2E acceptance.' >> "$GITHUB_STEP_SUMMARY"
