name: Refresh lockfile
on:
  # Dispara no push da branch (workflow_dispatch exige o arquivo na branch padrão).
  # O commit do lockfile altera só bun.lock, que não está nos filtros: sem laço.
  push:
    branches: ['chore/leave-lovable', 'feat/firebase-phase2a', 'fix/firebase-apphosting-failed-builds-audit']
    paths: ['package.json', '.github/workflows/refresh-lockfile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Regenerate npm lockfile with standard peer dependencies
        if: github.ref_name == 'fix/firebase-apphosting-failed-builds-audit'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve dependencies and rewrite bun.lock
        run: bun install
      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- bun.lock package-lock.json; then echo "Lockfiles already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          git commit -m "fix(firebase): regenerate npm lockfile for App Hosting"
          git push
