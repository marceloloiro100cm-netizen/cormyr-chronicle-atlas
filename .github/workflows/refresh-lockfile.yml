name: Refresh lockfile
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Resolve dependencies and rewrite bun.lock
        run: bun install
      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- bun.lock; then echo "bun.lock already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun.lock after leaving Lovable"
          git push
