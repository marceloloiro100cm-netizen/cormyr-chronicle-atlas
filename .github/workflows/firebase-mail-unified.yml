name: Firebase unified historical and live mailbox (private emulator)
on:
  pull_request:
    paths:
      - 'scripts/firebase/mail-web/**'
      - 'scripts/firebase/mail-browser.integration.mjs'
      - 'scripts/firebase/mail-command-service.mjs'
      - 'scripts/firebase/mail-http*.mjs'
      - 'scripts/firebase/serve-mail-emulator.mjs'
      - 'scripts/firebase/mail-unified-service.mjs'
      - 'scripts/firebase/mail-unified-service.integration.mjs'
      - 'scripts/firebase/letter-inbox-service.mjs'
      - 'firebase/firestore.domain.rules'
      - 'docs/firebase/MAIL-UNIFIED-EMULATOR.md'
      - 'docs/firebase/MAIL-HTTP-EMULATOR.md'
      - '.github/workflows/firebase-mail-unified.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/mail-web/**'
      - 'scripts/firebase/mail-browser.integration.mjs'
      - 'scripts/firebase/mail-command-service.mjs'
      - 'scripts/firebase/mail-http*.mjs'
      - 'scripts/firebase/serve-mail-emulator.mjs'
      - 'scripts/firebase/mail-unified-service.mjs'
      - 'scripts/firebase/mail-unified-service.integration.mjs'
      - 'scripts/firebase/letter-inbox-service.mjs'
      - '.github/workflows/firebase-mail-unified.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and existing inbox unit behavior
        run: |
          node --check scripts/firebase/mail-unified-service.mjs
          node --check scripts/firebase/mail-unified-service.integration.mjs
          node --check scripts/firebase/letter-inbox-service.mjs
          node --test scripts/firebase/letter-inbox-service.test.mjs scripts/firebase/mail-http-handler.test.mjs
          node --check scripts/firebase/serve-mail-emulator.mjs
          node --check scripts/firebase/mail-web/mail-ui.mjs
          node --check scripts/firebase/mail-browser.integration.mjs
          node scripts/verify-public-repo.mjs

  unified-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: npm install --no-save --package-lock=false firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0 playwright@1.56.1
      - name: Install browser for end-to-end verification
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run private historical and runtime mailbox E2E
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx firebase emulators:exec --only auth,firestore \
            --project demo-cormyr-migration \
            --config firebase/firebase-all.json \
            "node scripts/firebase/mail-unified-service.integration.mjs && node scripts/firebase/mail-http-server.integration.mjs"
