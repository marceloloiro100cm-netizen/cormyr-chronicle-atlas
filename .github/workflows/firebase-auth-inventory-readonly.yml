name: Firebase — protected Auth inventory (no deletion approval)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cloud-auth-inventory-readonly*.mjs'
      - '.github/workflows/firebase-auth-inventory-readonly.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and read-only inventory contract
        run: |
          node --check scripts/firebase/cloud-auth-inventory-readonly.mjs
          node --test scripts/firebase/cloud-auth-inventory-readonly.test.mjs
      - name: Public repository privacy check
        run: node scripts/verify-public-repo.mjs

  protected:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Read only current Auth and immutable source inventory
        id: inventory
        run: node scripts/firebase/cloud-auth-inventory-readonly.mjs
      - name: Explicitly preserve release gate
        if: always()
        run: echo 'Counting historical differences never approves the deleted identity or enables gameplay.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record audited run outcome without identities
        if: always()
        uses: actions/github-script@v7
        env:
          AUTH_AUDIT_OUTCOME: ${{ steps.inventory.outcome }}
        with:
          script: |
            if (context.repo.owner !== 'marceloloiro100cm-netizen' ||
                context.repo.repo !== 'cormyr-chronicle-atlas') return;
            const outcome = process.env.AUTH_AUDIT_OUTCOME === 'success'
              ? 'AUDITORIA REAL CONCLUÍDA (inventário agregado; NÃO aprova exclusão)'
              : 'AUDITORIA NÃO CONCLUÍDA (verificar aprovação/etapas do workflow)';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Evidência automatizada: inventário Auth protegido',
              `Resultado da etapa de leitura: **${outcome}**`,
              `Execução GitHub Actions: ${runUrl}`,
              'Sem UIDs, e-mails, nomes de Casas ou dados privados.',
              'A decisão de liberação continua **NO_GO** até aceite separado.'
            ].join('\\n\\n');
            await github.rest.issues.createComment({
              ...context.repo,issue_number:582,body,
            });
