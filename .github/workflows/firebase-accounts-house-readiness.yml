name: Firebase — contas e economias, auditoria de liberação

on:
  pull_request:
    paths:
      - 'scripts/firebase/cloud-account-service*.mjs'
      - 'scripts/firebase/accounts-cloud-readiness*.mjs'
      - 'scripts/firebase/accounts-auth-inventory*.mjs'
      - 'scripts/firebase/house-ops-cloud-acceptance*.mjs'
      - '.github/workflows/firebase-accounts-house-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cloud-account-service*.mjs'
      - 'scripts/firebase/accounts-cloud-readiness*.mjs'
      - 'scripts/firebase/accounts-auth-inventory*.mjs'
      - 'scripts/firebase/house-ops-cloud-acceptance*.mjs'
      - '.github/workflows/firebase-accounts-house-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar permissões revogadas, idempotência e auditoria somente leitura
        run: |
          node --check scripts/firebase/cloud-account-service.mjs
          node --check scripts/firebase/accounts-cloud-readiness.mjs
          node --check scripts/firebase/accounts-auth-inventory.mjs
          node --check scripts/firebase/house-ops-cloud-acceptance.mjs
          node --test scripts/firebase/cloud-account-service.test.mjs
          node --test scripts/firebase/accounts-cloud-readiness.test.mjs
          node --test scripts/firebase/accounts-auth-inventory.test.mjs
          node --test scripts/firebase/house-ops-cloud-acceptance.test.mjs
          node scripts/verify-public-repo.mjs

  cloud-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Autenticação temporária com a identidade de somente leitura
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cormyr
      - name: Conferir contas e escopos sem expor identidade
        run: node scripts/firebase/accounts-cloud-readiness.mjs
      - name: Reconciliar economias existentes e diagnosticar Casas ausentes
        run: node scripts/firebase/house-ops-cloud-acceptance.mjs
      - name: Restrições operacionais preservadas
        if: always()
        run: |
          echo 'Auditorias do Firestore somente GET; nenhuma conta, Casa, saldo, senha ou flag foi alterada.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Flag de gestão de contas e operações econômicas permanecem fechadas até o aceite Auth/Narrador/Jogador.' >> "$GITHUB_STEP_SUMMARY"


  auth-operator-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contracts
    # The pre-existing protected environment controls access to the
    # dedicated identity. This workflow never changes users or permissions.
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_AUTH_TEST_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Exigir conta técnica distinta da leitora
        run: |
          test -n "$CORMYR_AUTH_TEST_OPERATOR"
          test "$CORMYR_AUTH_TEST_OPERATOR" != "cormyr-gh-reader@cormyr.iam.gserviceaccount.com"
      - name: Autenticar a identidade técnica existente por OIDC temporário
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Instalar Firebase Admin com lockfile fixo
        run: bun install --frozen-lockfile
      - name: Conferir inventário real do Firebase Auth e vínculos do Firestore
        run: node scripts/firebase/accounts-auth-inventory.mjs
      - name: Confirmar que nenhuma conta ou senha foi alterada
        if: always()
        run: |
          echo 'Somente listUsers e leituras do Firestore. Nenhum usuário, senha, perfil, Casa ou IAM foi alterado.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contas continuam NO_GO para escrita até verificação real com Narrador e jogadores.' >> "$GITHUB_STEP_SUMMARY"
