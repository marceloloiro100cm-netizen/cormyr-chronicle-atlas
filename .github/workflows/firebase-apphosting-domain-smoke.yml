name: Firebase App Hosting domain smoke (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify atlas.cormyr.com.br without credentials or write operations
        run: node scripts/firebase-apphosting-smoke.mjs
