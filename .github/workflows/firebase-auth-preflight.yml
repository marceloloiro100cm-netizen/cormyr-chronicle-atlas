name: Firebase Auth backup preflight tests
on:
  pull_request:
    paths:
      - 'scripts/firebase/audit-auth-backup*.mjs'
      - 'scripts/firebase/audit-auth-destination*.mjs'
      - 'scripts/firebase/prepare-auth-import*.mjs'
      - 'scripts/firebase/diagnose-auth-identities*.mjs'
      - 'scripts/firebase/audit-auth-signin-coverage*.mjs'
      - '.github/workflows/firebase-auth-preflight.yml'
      - 'docs/firebase/AUTH-PREFLIGHT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/firebase/audit-auth-backup.mjs
      - run: node --test scripts/firebase/audit-auth-backup.test.mjs scripts/firebase/audit-auth-destination.test.mjs scripts/firebase/prepare-auth-import.test.mjs scripts/firebase/diagnose-auth-identities.test.mjs scripts/firebase/audit-auth-signin-coverage.test.mjs
      - run: node --check scripts/firebase/audit-auth-destination.mjs
      - run: node --check scripts/firebase/prepare-auth-import.mjs
      - run: node --check scripts/firebase/diagnose-auth-identities.mjs
      - run: node --check scripts/firebase/audit-auth-signin-coverage.mjs
      - run: node scripts/verify-public-repo.mjs
