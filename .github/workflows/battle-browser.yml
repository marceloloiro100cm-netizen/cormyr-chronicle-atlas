name: Battle browser acceptance (synthetic)
on:
  pull_request:
    paths:
      - 'src/lib/battle/**'
      - 'src/components/battle/**'
      - 'tests/battle/browser/**'
      - '.github/workflows/battle-browser.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: battle-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  battle-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      BATTLE_E2E_URL: 'http://127.0.0.1:4173/tests/battle/browser/harness.html'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned browser runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test React battle components in isolated Chromium
        run: |
          set -euo pipefail
          bunx vite --config tests/battle/browser/vite.config.ts --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/battle-browser-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail "$BATTLE_E2E_URL" > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat "$RUNNER_TEMP/battle-browser-vite.log"; exit 1; fi
          python -m unittest discover -s tests/battle/browser -p 'test_*.py' -v || { cat "$RUNNER_TEMP/battle-browser-vite.log"; exit 1; }
      - name: Clarify validation scope
        if: always()
        run: |
          echo '### Batalha — navegação sintética real no Chromium' >> "$GITHUB_STEP_SUMMARY"
          echo 'Este job testa mapa/editor/replay em dados fictícios e viewport mobile. Não comprova autenticação, RLS real nem deploy.' >> "$GITHUB_STEP_SUMMARY"
