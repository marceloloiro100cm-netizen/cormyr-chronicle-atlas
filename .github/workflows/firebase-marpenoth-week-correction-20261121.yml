name: Firebase Hub — corrigir Semana 4 para 3 (21 Marpenoth 1522)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/repair-temporal-week-marpenoth-20261121*.mjs'
      - '.github/workflows/firebase-marpenoth-week-correction-20261121.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cormyr-marpenoth-week-correction
  cancel-in-progress: false

jobs:
  contracts:
    name: Offline correction safety tests
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate scripts and negative safety cases
        run: |
          node --check scripts/firebase/repair-temporal-week-marpenoth-20261121.mjs
          node --test scripts/firebase/repair-temporal-week-marpenoth-20261121.test.mjs
          node scripts/verify-public-repo.mjs

  correct-firestore:
    name: Protected one-off Firestore correction
    needs: contracts
    if: >-
      github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'fix(firebase): correct Marpenoth week 4 to week 3'
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_AUTH_TEST_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
      CORMYR_WEEK_CORRECTION_ACK: OWNER_FIX_21_MARPENOTH_WEEK_3_20261121
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Require the already-approved protected OIDC operator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CORMYR_AUTH_TEST_OPERATOR"
          test "$CORMYR_AUTH_TEST_OPERATOR" != 'cormyr-gh-reader@cormyr.iam.gserviceaccount.com'
      - name: Exchange short-lived Google identity, without service-account keys
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Install locked Firebase Admin dependency
        run: bun install --frozen-lockfile
      - name: Verify live state, audit, mail, newspaper and event blockers (no writes)
        run: node scripts/firebase/repair-temporal-week-marpenoth-20261121.mjs --check
      - name: Atomically correct only current week and restore the last event publication
        run: node scripts/firebase/repair-temporal-week-marpenoth-20261121.mjs --apply
      - name: Independently verify persisted week and calendar
        run: node scripts/firebase/repair-temporal-week-marpenoth-20261121.mjs --check
      - name: Summarize safety scope
        if: always()
        run: |
          echo 'Requested date: 21 Marpenoth 1522 = 3rd desdia. Requested operational week: 3.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Correction is atomic and conditional: active week 4, last opening exactly week 3->4, synchronized mail clock, no new week-4 letters or newspaper, unchanged events.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Immutable migrated archive, letter content, editions, House sheets, spies and historical records are never modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The workflow aborts without writes if the preconditions fail or protected access is unavailable.' >> "$GITHUB_STEP_SUMMARY"
