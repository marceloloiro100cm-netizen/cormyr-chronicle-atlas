name: Import five spy portraits from Drive
on:
  push:
    branches: [feat/spy-portraits-all-local-20261104]
    paths:
      - .github/workflows/import-spy-portraits.yml
      - scripts/import_spy_portraits.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-spy-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/spy-portraits-all-local-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Import and optimize the five remaining photographs
        run: python scripts/import_spy_portraits.py
      - name: Commit verified JPEG assets to the import branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/spy-portraits/tillet.jpg public/spy-portraits/cortesa.jpg public/spy-portraits/vigia.jpg public/spy-portraits/guarda.jpg public/spy-portraits/ladrao.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets(spy): import five locally hosted profession portraits [skip ci]"
            git push origin HEAD:feat/spy-portraits-all-local-20261104
          fi
