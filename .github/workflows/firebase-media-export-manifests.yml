name: Firebase media exports — five-bucket offline manifest gate

on:
  pull_request:
    paths:
      - 'scripts/firebase/audit-media-export-manifests*.mjs'
      - '.github/workflows/firebase-media-export-manifests.yml'
      - 'docs/firebase/MEDIA-EXPORT-READINESS.md'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/audit-media-export-manifests*.mjs'
      - '.github/workflows/firebase-media-export-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-manifest-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test five-bucket private export contract with synthetic data only
        run: |
          node --check scripts/firebase/audit-media-export-manifests.mjs
          node --test scripts/firebase/audit-media-export-manifests.test.mjs
      - name: Protect the public repository from private campaign data
        run: node scripts/verify-public-repo.mjs
      - name: Make offline-only evidence scope explicit
        if: always()
        run: |
          echo "Five-bucket schema contract tested with synthetic fixtures only." >> "$GITHUB_STEP_SUMMARY"
          echo "No real export contents, file bytes or source/destination Cloud data accessed." >> "$GITHUB_STEP_SUMMARY"
          echo "A complete manifest is necessary but not sufficient; readyForCutover=false." >> "$GITHUB_STEP_SUMMARY"
