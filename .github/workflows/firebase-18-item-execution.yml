name: Firebase — 18 requested items evidence gates

on:
  pull_request:
    paths:
      - 'scripts/firebase/**'
      - 'src/integrations/backend/**'
      - 'src/lib/auth/**'
      - 'docs/firebase/EXECUTION-18-ITEMS.md'
      - 'docs/firebase/PHASE2-ROADMAP.md'
      - 'docs/firebase/APP-INTEGRATION-PLAN.md'
      - 'docs/firebase/LOTS6-9-STATUS.md'
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'src/start.ts'
      - 'apphosting.yaml'
      - '.github/workflows/firebase-18-item-execution.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/**'
      - 'src/integrations/backend/**'
      - 'docs/firebase/EXECUTION-18-ITEMS.md'
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'src/start.ts'
      - 'apphosting.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all 18 scoped implementation contracts and no-cutover safety
        run: |
          node --check scripts/firebase/execute-18-items-readiness.mjs
          node --test scripts/firebase/execute-18-items-readiness.test.mjs
          node scripts/firebase/execute-18-items-readiness.mjs
          node scripts/verify-public-repo.mjs
      - name: Scope the evidence honestly
        if: always()
        run: |
          echo "18 items enumerated by source files; code present does not prove Cloud migration or functional equivalence." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing 20-service Auth/Firestore Emulator tests are run separately by Firebase cross-domain acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "No Supabase/Cloud credentials, real campaign data, production mutation or migration was used." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud data source and credentials must be verified independently before cutover. readyForCutover=false." >> "$GITHUB_STEP_SUMMARY"
