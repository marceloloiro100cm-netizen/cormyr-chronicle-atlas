name: Firebase complete source coverage audit
on:
  # Só manual desde 17/11/2026: cobertura consolidada em Validate e
  # firebase-cross-domain-acceptance (docs/firebase/REVISAO-WORKFLOWS-2026-11-17.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify aggregate migration inventory
        run: |
          node --check scripts/firebase/audit-migration-coverage.mjs
          node --test scripts/firebase/audit-migration-coverage.test.mjs
          node scripts/verify-public-repo.mjs
