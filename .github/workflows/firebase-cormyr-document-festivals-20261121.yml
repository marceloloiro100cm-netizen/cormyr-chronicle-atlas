name: Firebase Cormyr — importar festivais do documento sem duplicar

on:
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cormyr-festivals-catalog-20261121.mjs'
      - 'scripts/firebase/import-cormyr-document-festivals-20261121*.mjs'
      - 'src/lib/firebase-workspace/service.ts'
      - '.github/workflows/firebase-cormyr-document-festivals-20261121.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cormyr-document-festival-import-20261121
  cancel-in-progress: false

jobs:
  contracts:
    name: Verify source catalog and no-duplicate rules
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all catalog, alias, collision and tombstone tests
        run: |
          node --check scripts/firebase/cormyr-festivals-catalog-20261121.mjs
          node --check scripts/firebase/import-cormyr-document-festivals-20261121.mjs
          node --test scripts/firebase/import-cormyr-document-festivals-20261121.test.mjs
          node scripts/verify-public-repo.mjs

  live-preflight:
    name: Check existing Firestore festivals and events without writing
    needs: contracts
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - name: Install locked Firebase Admin
        run: bun install --frozen-lockfile
      - name: Inventory existing Hub festivals and published/draft events; report only counts
        run: node scripts/firebase/import-cormyr-document-festivals-20261121.mjs --check

  protected-import:
    name: Import only missing festivals to Firestore
    needs: [contracts,live-preflight]
    if: >-
      github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas' &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      github.event.head_commit.message == 'feat(firebase): import only missing Cormyr document festivals'
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_AUTH_TEST_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
      CORMYR_FESTIVAL_IMPORT_ACK: OWNER_IMPORT_CORMYR_DOCUMENT_FESTIVALS_20261121
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Require existing write-authorized operator, not OIDC reader
        run: |
          test -n "$CORMYR_AUTH_TEST_OPERATOR"
          test "$CORMYR_AUTH_TEST_OPERATOR" != 'cormyr-gh-reader@cormyr.iam.gserviceaccount.com'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Install locked Firebase Admin
        run: bun install --frozen-lockfile
      - name: Recheck duplicates and current runtime
        run: node scripts/firebase/import-cormyr-document-festivals-20261121.mjs --check
      - name: Create only missing records with atomic audit and no changes to existing events
        run: node scripts/firebase/import-cormyr-document-festivals-20261121.mjs --apply
      - name: Verify imported festival documents
        run: node scripts/firebase/import-cormyr-document-festivals-20261121.mjs --check
      - name: State preservation scope
        if: always()
        run: |
          echo 'Source 47 indexed occurrences: 6 existing intercalares, 12 existing Waukeen days, 4 existing seasons, 25 candidate additional celebrations.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing festivals and published/draft events are skipped. Dates conflicting with existing entries abort the import.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Waukeentide source discrepancy retained: Tarsakh 2/11/22 in the index versus 1/7/10 in the narrative.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No calendar clock, mail, newspaper edition, source archive, spy mission, House or historical record is updated.' >> "$GITHUB_STEP_SUMMARY"
