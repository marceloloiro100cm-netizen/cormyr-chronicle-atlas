name: Firebase Lote 5 - security and emulator acceptance
on:
  pull_request:
    paths:
      - 'firebase/firestore.domain.rules'
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'scripts/firebase/lot5-*.mjs'
      - 'scripts/firebase/lot8-*.mjs'
      - '.github/workflows/firebase-lot5-security-e2e.yml'
      - 'docs/firebase/LOT5-SECURITY-E2E.md'
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.domain.rules'
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'scripts/firebase/lot5-*.mjs'
      - 'scripts/firebase/lot8-*.mjs'
      - '.github/workflows/firebase-lot5-security-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, source security and closed cloud cutover gates
        run: |
          node --check scripts/firebase/lot5-safety-preflight.mjs
          node --check scripts/firebase/lot5-role-security.integration.mjs
          node --test scripts/firebase/lot5-safety-preflight.test.mjs
          node scripts/firebase/lot5-safety-preflight.mjs
      - name: Never commit private data to the public repository
        run: node scripts/verify-public-repo.mjs

  role-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable Firebase SDK and emulator tools
        run: npm install --no-save --package-lock=false --legacy-peer-deps firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0
      - name: Narrator, player, editor and anonymous E2E security matrix on Firestore Emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          npx firebase emulators:exec --only firestore,auth \
            --project demo-cormyr-migration \
            --config firebase/firebase-all.json \
            "node scripts/firebase/lot5-role-security.integration.mjs"
