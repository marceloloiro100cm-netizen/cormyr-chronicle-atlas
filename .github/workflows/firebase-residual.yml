name: Firebase residual stage (private emulator)
on:
  # Só manual desde 17/11/2026: cobertura consolidada em Validate e
  # firebase-cross-domain-acceptance (docs/firebase/REVISAO-WORKFLOWS-2026-11-17.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: node --check scripts/firebase/stage-residual-emulator.mjs
      - name: Unit tests
        run: node --test scripts/firebase/stage-residual-emulator.test.mjs
      - name: Public-repository private-data gate
        run: node scripts/verify-public-repo.mjs
