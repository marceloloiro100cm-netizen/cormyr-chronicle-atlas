name: Firebase Cloud access readiness — read-only OIDC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/firebase/cloud-access-readiness*.mjs'
      - '.github/workflows/firebase-cloud-access-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/cloud-access-readiness*.mjs'
      - '.github/workflows/firebase-cloud-access-readiness.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synthetic Firebase Cloud readiness access contract
        run: node --test scripts/firebase/cloud-access-readiness.test.mjs
      - name: Public repository privacy verification
        run: node scripts/verify-public-repo.mjs

  cloud-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Short-lived GitHub OIDC for existing read-only GCP identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cormyr
      - name: Read Firebase Firestore and Auth aggregate readiness only
        run: node scripts/firebase/cloud-access-readiness.mjs
      - name: Retain required Firebase production gates
        if: always()
        run: |
          echo 'Cloud inspection is GET only and emits no UID, email, snapshot hash or content.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The GitHub OIDC account may lack Firestore/Auth READ permissions; this is not a failed deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No account activation, App Hosting flag, runtime initialization or data writes; readyForCutover=false.' >> "$GITHUB_STEP_SUMMARY"
