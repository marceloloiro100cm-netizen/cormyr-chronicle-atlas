name: Generate npm lock for App Hosting (temporary)
on:
  push:
    branches:
      - fix/apphosting-npm-lock
    paths:
      - .github/workflows/apphosting-npm-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apphosting-npm-lock
      # Mesmo Node do runtime do App Hosting (nodejs24).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the full npm dependency graph and verify a clean install
        run: |
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify the Node build output
        run: |
          NITRO_PRESET=node-server npm run build
          test -f .output/server/index.mjs
      - name: Commit only package-lock.json
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then echo "Lockfile already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(apphosting): add npm lockfile verified by npm ci"
          git push origin HEAD:refs/heads/fix/apphosting-npm-lock
