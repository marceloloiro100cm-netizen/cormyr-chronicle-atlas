name: Regenerate lockfiles for App Hosting (temporary)
on:
  push:
    branches:
      - fix/apphosting-npm-lock-2
    paths:
      - .github/workflows/apphosting-npm-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'marceloloiro100cm-netizen/cormyr-chronicle-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apphosting-npm-lock-2
      # Versão exata do Node do buildpack do App Hosting (npm que vem junto).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Show versions
        run: node -v && npm -v
      - name: Regenerate package-lock.json and verify a clean install
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify the Node build output
        run: |
          NITRO_PRESET=node-server npm run build
          test -f .output/server/index.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Refresh bun.lock for the CI
        run: bun install
      - name: Commit lockfiles
        run: |
          git add -- package-lock.json bun.lock
          if git diff --cached --quiet; then echo "Lockfiles already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(apphosting): regenerate lockfiles without rolldown override"
          git push origin HEAD:refs/heads/fix/apphosting-npm-lock-2
