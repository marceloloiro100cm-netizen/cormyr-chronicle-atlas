name: Firebase site runtime (homologation only)
on:
  pull_request:
    paths:
      - 'vite.firebase.config.ts'
      - 'Dockerfile.firebase'
      - '.dockerignore'
      - 'firebase.hosting-homolog.json'
      - 'scripts/firebase/verify-node-build.mjs'
      - '.github/workflows/firebase-site-runtime.yml'
      - 'docs/firebase/SITE-HOSTING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build without Lovable Vite wrapper
        env:
          NITRO_PRESET: node_server
        run: bunx vite build --config vite.firebase.config.ts
      - name: Smoke-test SSR on localhost
        run: node scripts/firebase/verify-node-build.mjs
      - name: Verify public repository privacy
        run: node scripts/verify-public-repo.mjs

  docker-smoke:
    runs-on: ubuntu-latest
    needs: native-ssr
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Cloud Run image
        run: docker build -f Dockerfile.firebase -t cormyr-firebase-ssr:test .
      - name: Boot container and verify SSR on localhost
        run: |
          set -euo pipefail
          docker run -d --name cormyr-firebase-ssr-smoke \
            -p 127.0.0.1:48619:8080 cormyr-firebase-ssr:test
          trap 'docker logs cormyr-firebase-ssr-smoke || true; docker rm -f cormyr-firebase-ssr-smoke >/dev/null 2>&1 || true' EXIT
          for n in $(seq 1 60); do
            status=$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:48619/ 2>/dev/null || true)
            if [ "$status" = "200" ]; then
              echo "Container SSR: HTTP 200"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not respond HTTP 200" >&2
          exit 1
