name: Build check
on:
  pull_request:
  push:
    branches: [main, 'chore/leave-lovable']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Unique run IDs for main/manual jobs preserve both running and queued evidence.
  # PRs alone share a branch group so superseded checks can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun install
      - name: Build (Node target, same as App Hosting)
        env:
          NITRO_PRESET: node-server
        run: bun run build
      - name: Confirm Node server output
        run: test -f dist/server/index.mjs
      - name: Newspaper typography component tests
        run: bun run test -- src/components/newspaper/NewspaperCanvas.test.tsx src/components/newspaper/NewspaperEditorialDesk.test.tsx
      - name: Public Nobreza layout and editorial regression tests
        run: bun run test -- src/test/public-nobility-phases12.test.ts src/test/public-nobility-phases34.test.ts src/test/frontend-audit-public.test.ts
