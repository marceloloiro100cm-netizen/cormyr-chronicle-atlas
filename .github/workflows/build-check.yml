name: Build check
on:
  pull_request:
  push:
    branches: [main, 'chore/leave-lovable']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun install
      - name: Build (Node target, same as App Hosting)
        env:
          NITRO_PRESET: node-server
        run: bun run build
      - name: Confirm Node server output
        run: test -f .output/server/index.mjs
