name: Firebase Auth 14 accounts — read-only diagnosis

on:
  # Só manual desde 17/11/2026: cobertura consolidada em Validate e
  # firebase-cross-domain-acceptance (docs/firebase/REVISAO-WORKFLOWS-2026-11-17.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Offline safety contract (no Cloud access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify 14-account inventory, preview read-only and privacy rules
        run: node --test scripts/firebase/auth-enable-all-test-accounts.test.mjs
      - name: Public repository privacy check
        run: node scripts/verify-public-repo.mjs

  cloud-readonly:
    name: Read-only Firebase Auth preflight with existing GitHub reader
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_AUTH_ACTIVATION_MODE: preview
      CORMYR_AUTH_ACTIVATION_CONFIRMATION: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Authenticate temporary read-only GitHub OIDC principal
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: cormyr-gh-reader@cormyr.iam.gserviceaccount.com
          project_id: cormyr
      - name: Install locked Firebase Admin dependency
        run: bun install --frozen-lockfile
      - name: Preview 14-account inventory and report only fixed error codes
        run: node scripts/firebase/auth-enable-all-test-accounts.mjs
      - name: Prevent false release conclusions
        if: always()
        run: |
          echo 'This is a read-only probe with cormyr-gh-reader, NOT the protected technical-admin operator.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No account updates, Firestore writes, IAM changes or deployments can be performed by this job.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A denial on the reader does not establish a denial on the privileged operator; real activation still requires manual environment approval.' >> "$GITHUB_STEP_SUMMARY"
