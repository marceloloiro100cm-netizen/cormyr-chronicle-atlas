name: Espionagem — painel publicado (revisão isolada)
on:
  pull_request:
    paths:
      - 'src/lib/espionage/**'
      - 'src/components/house/espionage/**'
      - 'src/components/house/hub.tsx'
      - 'src/test/espionage-*.test.ts'
      - '.github/workflows/espionage-live-panel.yml'
      - 'tsconfig.espionage-live.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spy-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Regional routing and narrator approval schemas
        run: bunx vitest run src/test/espionage-region-turns.test.ts src/test/espionage-region-review.test.ts src/test/espionage-cormyr-map.test.tsx
      - name: Harptos desdia time projections
        run: bunx vitest run src/test/espionage-desdia-temporal.test.ts
      - name: Scoped TypeScript verification (spy module and integration)
        run: bunx tsc -p tsconfig.espionage-live.json --noEmit
      - name: Production build without deploying
        run: bun run build
