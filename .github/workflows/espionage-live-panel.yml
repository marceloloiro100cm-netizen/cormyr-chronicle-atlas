name: Espionagem — painel publicado (revisão isolada)
on:
  pull_request:
    paths:
      - 'src/lib/espionage/**'
      - 'src/components/house/espionage/**'
      - 'src/components/house/hub.tsx'
      - 'src/test/espionage-*.test.ts'
      - 'src/test/espionage-*.test.tsx'
      - 'src/components/house/asset-catalog.tsx'
      - '.github/workflows/espionage-live-panel.yml'
      - 'tsconfig.espionage-live.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spy-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Regional routing and narrator approval schemas
        run: bunx vitest run src/test/espionage-region-turns.test.ts src/test/espionage-region-review.test.ts src/test/espionage-cormyr-map.test.tsx src/test/espionage-house-management.test.ts src/test/espionage-npc-defense.test.ts
      - name: Harptos desdia time projections
        run: bunx vitest run src/test/espionage-desdia-temporal.test.ts
      - name: Spy P0-P2 integrity, UX and permission regression suites
        run: >-
          bunx vitest run
          src/test/espionage-p0-integrity.test.ts
          src/test/espionage-p0-server.test.ts
          src/test/espionage-p1-ux.test.ts
          src/test/espionage-p2-operations-integration.test.ts
          src/test/espionage-p2-rpc-privacy.test.ts
          src/test/espionage-planner-three-step-flow.test.ts
          src/test/espionage-dossier-rpc-binding.test.ts
      - name: Spy P3 report privacy, narrator history and print regression suites
        run: >-
          bunx vitest run
          src/test/espionage-p3-reports.test.ts
          src/test/espionage-p3-rpc-privacy.test.ts
      - name: Spy R4 real server RPC and complete usability journey
        run: >-
          bunx vitest run
          src/test/espionage-r4-real-server-actions.test.ts
          src/test/espionage-r4-ux-flow.test.ts
      - name: Scoped TypeScript verification (spy module and integration)
        run: bunx tsc -p tsconfig.espionage-live.json --noEmit
      - name: Production build without deploying
        run: bun run build
