name: Espionagem Marcos A e B (isolated)
on:
  pull_request:
    paths:
      - 'src/lib/espionage/**'
      - 'src/test/espionage-*'
      - 'src/components/house/espionage/**'
      - 'src/components/house/hub.tsx'
      - 'scripts/espionage-lote0-audit*'
      - 'docs/espionage/**'
      - 'tsconfig.espionage.json'
      - '.github/workflows/espionage-marco-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  espionage-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Locked dependencies
        run: bun install --frozen-lockfile
      - name: Lote 0 source audit
        run: node scripts/espionage-lote0-audit.mjs
      - name: Vitest Lote 1 — contracts
        run: bunx vitest run src/test/espionage-contracts.test.ts
      - name: Vitest Lote 2 — economy
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-economy.test.ts
      - name: Vitest Lote 3 — routes
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-routes.test.ts
      - name: Vitest Lote 4 — travel
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-travel.test.ts
      - name: Vitest Lote 5 — assets
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-assets.test.ts
      - name: Marco A integrated two-agent scenario
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-marco-a.test.ts
      - name: Vitest Lote 6 — missões e dificuldades
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-missions.test.ts
      - name: Vitest Lote 7 — dossiês e relatórios
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-dossier.test.ts
      - name: Vitest Lote 8 — UI jogador
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-player-ui.test.tsx
      - name: Vitest Lote 9 — UI Narrador
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-narrator-ui.test.tsx
      - name: "Strategy - regional rounds, sea and live spy position"
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-region-turns.test.ts
      - name: Vitest - 10-day Harptos desdia forecast
        if: ${{ always() }}
        run: bunx vitest run src/test/espionage-desdia-temporal.test.ts
      - name: TypeScript integrity (Marcos A e B)

        if: ${{ always() }}
        run: bunx tsc --project tsconfig.espionage.json --noEmit
