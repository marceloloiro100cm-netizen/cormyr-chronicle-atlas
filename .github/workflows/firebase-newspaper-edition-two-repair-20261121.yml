name: Firebase Jornal — corrigir apenas edição 4 para 2 (21-11-2026)

on:
  pull_request:
    paths:
      - 'scripts/firebase/repair-newspaper-edition-two-20261121*.mjs'
      - '.github/workflows/firebase-newspaper-edition-two-repair-20261121.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/repair-newspaper-edition-two-20261121*.mjs'
      - '.github/workflows/firebase-newspaper-edition-two-repair-20261121.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir os filtros de segurança sem acessar banco real
        run: |
          node --check scripts/firebase/repair-newspaper-edition-two-20261121.mjs
          node --test scripts/firebase/repair-newspaper-edition-two-20261121.test.mjs
          node scripts/verify-public-repo.mjs

  correct-one-public-number:
    # Uma única reparação de número solicitada pelo proprietário.
    # Só o ambiente técnico protegido pode fornecer a identidade gravadora.
    # Não tenta gravar no Cloud em pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: contracts
    environment: firebase-auth-test-activation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: cormyr
      CORMYR_AUTH_TEST_OPERATOR: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
      CORMYR_NEWSPAPER_NUMBER_CORRECTION_ACK: REN_NUMBER_4_TO_2_20261121
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Garantir identidade operacional já autorizada e não somente leitora
        run: |
          test -n "$CORMYR_AUTH_TEST_OPERATOR"
          test "$CORMYR_AUTH_TEST_OPERATOR" != "cormyr-gh-reader@cormyr.iam.gserviceaccount.com"
      - name: Autenticação OIDC de curta duração, sem chaves armazenadas
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/477785088395/locations/global/workloadIdentityPools/cormyr-gh-migration/providers/github-main
          service_account: ${{ vars.CORMYR_FIREBASE_AUTH_TEST_OPERATOR }}
          project_id: cormyr
      - name: Instalar Firebase Admin com dependências travadas
        run: bun install --frozen-lockfile
      - name: Pré-verificar edição, origem, data e ausência de edição nº 2 publicada
        run: node scripts/firebase/repair-newspaper-edition-two-20261121.mjs --check
      - name: Corrigir SOMENTE campo editionNo na edição Cloud verificada e registrar auditoria
        run: node scripts/firebase/repair-newspaper-edition-two-20261121.mjs --apply
      - name: Conferir leitura após a transação
        run: node scripts/firebase/repair-newspaper-edition-two-20261121.mjs --check
      - name: Resumo de escopo
        if: always()
        run: |
          echo 'Reparo limitado a Firestore campaignCloudRuntime/.../publishedNewspapers (editionNo 4->2) e trilha operacional.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nenhuma imagem, matéria, edição histórica importada, data ou contador de publicação é modificada.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Conflitos, edição nº 2 já publicada, ambiguidades ou IAM insuficiente abortam sem mutação.' >> "$GITHUB_STEP_SUMMARY"
