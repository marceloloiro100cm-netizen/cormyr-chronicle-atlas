name: Firebase cross-domain acceptance — isolated emulator

on:
  pull_request:
    paths:
      - 'scripts/firebase/**'
      - 'firebase/firestore.domain.rules'
      - 'firebase/firebase-all.json'
      - 'src/integrations/backend/**'
      - '.github/workflows/firebase-cross-domain-acceptance.yml'
      - 'docs/firebase/CROSS-DOMAIN-ACCEPTANCE.md'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/**'
      - 'firebase/firestore.domain.rules'
      - 'firebase/firebase-all.json'
      - 'src/integrations/backend/**'
      - '.github/workflows/firebase-cross-domain-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate synthetic-only execution and release gates
        run: |
          node --check scripts/firebase/full-domain-emulator-acceptance.mjs
          node --test scripts/firebase/cloud-season2-house-scope.test.mjs
          node --test scripts/firebase/full-domain-emulator-acceptance.test.mjs scripts/firebase/lot9-cutover-gate.test.mjs scripts/firebase/cloud-readonly-service.test.mjs scripts/firebase/cloud-mail-service.test.mjs scripts/firebase/cloud-house-treasury-service.test.mjs scripts/firebase/cloud-treasury-audit-service.test.mjs
          node scripts/firebase/lot9-cutover-gate.mjs
          node scripts/verify-public-repo.mjs

  module-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [houses, communications, strategy, operations, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase emulators and SDKs (no Cloud credentials)
        run: npm install --no-save --package-lock=false --legacy-peer-deps firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0
      - name: Cross-domain tests — synthetic Auth and Firestore only
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          npx firebase emulators:exec --only firestore,auth \
            --project demo-cormyr-migration \
            --config firebase/firebase-all.json \
            "node scripts/firebase/full-domain-emulator-acceptance.mjs ${{ matrix.group }}"
      - name: Explicitly retain NO_GO for production data cutover
        if: always()
        run: |
          echo "Cross-domain matrix: ${{ matrix.group }} — synthetic LOCAL emulator only." >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase Cloud identity, five buckets, production frontend, mail writes and data reconciliation are not verified by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "readyForCutover=false; no production data or credentials used." >> "$GITHUB_STEP_SUMMARY"
