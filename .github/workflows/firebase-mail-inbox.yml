name: Firebase private mail inbox read backend
on:
  pull_request:
    paths:
      - 'scripts/firebase/letter-inbox-service*.mjs'
      - 'scripts/firebase/stage-typed-domain-emulator.mjs'
      - 'firebase/firestore.domain.rules'
      - 'docs/firebase/MAIL-INBOX-EMULATOR.md'
      - '.github/workflows/firebase-mail-inbox.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/firebase/letter-inbox-service*.mjs'
      - 'scripts/firebase/stage-typed-domain-emulator.mjs'
      - 'firebase/firestore.domain.rules'
      - '.github/workflows/firebase-mail-inbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and role/scoping logic
        run: |
          node --check scripts/firebase/letter-inbox-service.mjs
          node --check scripts/firebase/letter-inbox-service.integration.mjs
          node --test scripts/firebase/letter-inbox-service.test.mjs
          node --test scripts/firebase/stage-typed-domain-emulator.test.mjs
          node scripts/verify-public-repo.mjs

  inbox-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test SDK and emulator
        run: npm install --no-save --package-lock=false firebase-tools@15.35.0 firebase-admin@14.5.1 firebase@13.3.0 @firebase/rules-unit-testing@6.0.0
      - name: Execute real Firestore Emulator access tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-cormyr-migration \
            --config firebase/firebase-domain.json \
            "node scripts/firebase/letter-inbox-service.integration.mjs"
